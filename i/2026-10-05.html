o-was-coming-in-june-new-lawsuit-claims-alphabet-knew-its-flagship-ai-model-was-struggling/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Google Told Investors Gemini 3.5 Pro Was Coming in June</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">USA Herald</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#0b1424 0%,#16345c 52%,#1d488f 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Artificial Intelligence &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Washington Becomes The Battleground AI Labs Fight To Control</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">A billion deaths</span>&amp;nbsp; what Bill Gates warned AI could cause without safeguards, as he urged Congress to pass safety legislation.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next five to ten years, the winners in AI won&#39;t just be the labs with the best models, they&#39;ll be the ones that help write the rules everyone else has to follow. Watch the big players race to befriend Washington: the companies that shape what counts as "safe" AI get to build the testing and oversight machinery that smaller rivals must pay to pass through.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeeze lands on scrappy startups and open-model makers who lack the lobbyists, lawyers, and White House dinners to turn safety talk into their own advantage.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week Trump named intelligence chief Jay Clayton to run a new "Super Intelligence Force," Anthropic&#39;s Dario Amodei landed a one-on-one dinner with the president, and both Anthropic and OpenAI publicly called for their own models to be independently tested before release. Each move is a bid to shape the rules.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Pushing hard for government AI regulation and scoring a direct Trump dinner, though critics compare its lobbying to Sam Bankman-Fried&#39;s crypto playbook.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Altman says the world should accept some harm for AI&#39;s benefits, a lighter-touch stance even as a safety leader quit over weak care.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Alphabet (Google)</strong> Facing a securities suit alleging it misled investors about Gemini 3.5 Pro&#39;s timing and disappointing training results, a credibility test mid-race.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The law firms and compliance shops stand to get paid no matter which lab wins. Every securities suit against Alphabet, every court fight like xAI&#39;s in Minnesota, and every new testing requirement means billable work for the people who navigate AI&#39;s growing legal thicket.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic, influence spend:</strong> Its heavy regulatory lobbying and White House access are the week&#39;s real capital move, buying a seat at the rule-writing table.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">xAI, legal push:</strong> Won an injunction pausing Minnesota&#39;s AI nudification ban, spending on courtroom fights to keep deployment rules loose.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">No major rounds this week:</strong> The dollars stayed quiet; the contest was over political capital and credibility, not fresh funding.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This shows up in energy. The pace that regulators and the new AI czar set for releasing and deploying big models directly drives how fast data centers get built, and those centers are the biggest new source of electricity demand in the country.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more White House meetings, dueling safety proposals, and courts repeatedly pausing state AI laws before any federal standard sticks.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> The handful of labs that help write the safety rulebook harden into gatekeepers everyone else must pay and please.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Congress and the courts settle on light, uniform rules that apply equally to everyone, the labs lose their edge from shaping regulation, and the courts are already pushing back, as the 8th Circuit&#39;s pause of Minnesota&#39;s deepfake ban shows.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Maybe this safety talk is mostly theater, and the companies that win are simply the ones shipping tools people love, like Meta weaving AI across its apps, regardless of who dines with the president. Governments move slowly and courts keep striking laws down, so all this regulatory jockeying could produce years of distraction and very little that actually changes who makes money.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The two labs fighting hardest over the rules, Anthropic and OpenAI, are both still private, as is Elon Musk&#39;s xAI, which won this week&#39;s deepfake ban pause. You can&#39;t buy them yet, but whoever shapes the regulation now will carry that advantage straight into an eventual public listing.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Clayton&#39;s Super Intelligence Force agenda:</strong> Its first priorities will show whether government oversight favors the incumbents writing safety standards or opens the door wider.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Fallout from the Amodei-Trump dinner:</strong> Any policy shift afterward tells you whether private access to the president is becoming the real currency in AI.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Alphabet securities lawsuit progress:</strong> How this plays out sets expectations for how honest labs must be with investors about model timelines and failures.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a hre -luckey-and-gingrich-120-days-to-map-future-wars-from-underground-to-the-moon/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Pentagon&#39;s Project Meridian Gives Musk, Luckey and Gingrich 120 Days to Map Future Wars From Underground to the Moon</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">USA Herald</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://edition.cnn.com/2026/10/02/business/us-china-tech-bans-intl-hnk-dst" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">America wants to wean itself off Chinese technology. Will the pain pay off?</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Cable News Network</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.bostonglobe.com/2026/10/01/business/walden-robotics-ai-cambridge/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Walden Robotics expands Cambridge footprint with 50,000 square-foot office lease</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">The Boston Globe</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#170833 0%,#341563 52%,#552aa0 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Robotics &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Robot Brains Get Funded While Hands Finally Work</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$10 billion</span>&amp;nbsp; FieldAI&#39;s new valuation for its robot brain, more than quadrupled in just over a year after a $700 million round.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The money in robotics is moving toward two kinds of companies: the ones building the software "brain" that lets any robot think and adapt, and the ones solving the unglamorous hardware problems like hands that can hold real tools. Over the next five to ten years, the winners will be the firms that own a general-purpose robot mind and the specialists tuning AI to one industry&#39;s actual work.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Generic body-builders who can&#39;t control their own software, and anyone over-reliant on Chinese parts, get squeezed hard.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">FieldAI raised $700 million at a $10 billion valuation for a robot "brain" that runs humanoids and drones alike, more than quadrupling in a year. Boston Dynamics gave Atlas four-fingered hands with 13 degrees of freedom, proof the field is cracking the dexterity problem that long kept robots useless with real tools.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">FieldAI</strong> Building one general-purpose brain for robots from humanoids to drones, and investors just backed it at $10 billion, a bet on software over bodies.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Boston Dynamics</strong> Its redesigned Atlas hands with dense tactile sensors show the hardware side is finally solving dexterity, the piece that makes robots commercially useful.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Figure AI</strong> Staged a dramatic robot decommissioning amid safety worries, a reminder that trust and control matter as much as capability for adoption.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The commercial real estate and specialized component suppliers get paid regardless of which robot maker wins. Walden Robotics just leased 50,000 square feet in Cambridge, and every humanoid firm scrambling to avoid Chinese parts creates steady demand for Western sensor, actuator, and tactile-hardware makers.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">FieldAI, $700M:</strong> Raised at a $10 billion valuation for a general-purpose robot brain, the clearest sign investors are paying up for robot software.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Walden Robotics, $300M:</strong> Toyota&#39;s humanoid spinout launched this year with that backing and is now expanding into 50,000 square feet in Cambridge.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Pentagon, Project Meridian:</strong> A 120-day effort co-led by Musk and Luckey to map future weapons could redirect huge defense dollars toward autonomous systems.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into AI, since a robot brain that generalizes across humanoids and drones is the same kind of foundation model work driving the AI boom. FieldAI&#39;s raise shows AI progress now shows up as physical machines that handle tools, not just chatbots on screens.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more giant raises for robot-brain software and louder demos of dexterous hands, with real factory deployments still thin.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Robotics splits into a few owners of the general-purpose brain plus industry specialists, while generic body-only makers fade or get absorbed.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the general-purpose robot brain turns out to be hype and robots still need custom programming per task, FieldAI&#39;s $10 billion bet collapses, and the whole thesis that software beats bodies falls apart.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The dream of one brain that runs every robot has been promised for years, and real factories still need painstaking per-task tuning that generic software can&#39;t shortcut. Sky-high valuations like FieldAI&#39;s $10 billion assume a breakthrough that hasn&#39;t shipped at scale, so patient buyers may be funding demos, not deployed products.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">FieldAI is the standout private name, fresh off $700 million at a $10 billion valuation, and Walden Robotics, Toyota&#39;s humanoid spinout launched this year with $300 million, is another to track. Both are private today, so watch their deployments and any future rounds for where robotics money is really flowing.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>FieldAI deployment proof:</strong> Whether its brain actually runs many different robot types in paying customers&#39; facilities, not just demos, tests the general-purpose claim.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Project Meridian recommendations:</strong> The Musk-Luckey-Gingrich report, due January 28, 2027, could steer billions in defense spending toward autonomous systems and robotics.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Chinese parts substitution:</strong> Whether firms like Chef Robotics can build competitive robots without Chinese components shows if US supply-chain independence is affordable or painful.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#7c3aed;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Robotics analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #ea580c;"><tr><td style="border-left:3px solid #ea580c;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#ea580c;">Space</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Space</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.mos.cms.futurecdn.net/Lsm2P7voJTgXBhjsjoR9nd-1920-80.jpg" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:10px;">Space</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">On this day in space! Oct. 4, 1957: The Soviet Union launches Sputnik 1, the 1st artificial satellite, into orbit to kick off a Space Race and the Space Age</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">On October 4, 1957, the Soviet Union launched Sputnik 1, the first human-made object to orbit Earth, triggering a wave of anxiety in the United States known as the Sputnik crisis. The launch marked the beginning of the Space Race and is widely regarded as the dawn of the Space Age. The anniversary serves as a reminder of how a single launch reshaped global science, politics, and exploration.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">Space.com</td><td style="padding-left:16px;"><a href="https://www.space.com/space-exploration/on-this-day-in-space-october-4-2026" style="font-size:14px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://www.cnet.com/wp-content/uploads/sites/2/GettyImages-1412310676.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Why the Moon Is a Legal Wild West</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">CNET</td><td style="padding-left:10px;"><a href="https://www.cnet.com/science/space/why-the-moon-is-a-legal-wild-west/" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.mos.cms.futurecdn.net/L3HYK4hkM2gUTjBQbBMVkG-1600-80.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">On this day in space! Sept. 27, 1997: NASA&#39;s Mars Pathfinder lander sends its last transmission to Earth</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Space.com</td><td style="padding-left:10px;"><a href="https://www.space.com/space-exploration/on-this-day-in-space-september-27-2026" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.latimes.com/science/story/2026-09-27/spacecraft-burns-up-in-atmosphere-after-failing-to-rescue-nasa-telescope" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Spacecraft burns up in atmosphere after failing to rescue NASA telescope</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Los Angeles Times</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.politico.com/news/2026/09/27/the-startup-bringing-the-spacex-playbook-to-nuclear-power-01084143" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The startup bringing the SpaceX playbook to nuclear power</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">POLITICO</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/launches-spacecraft/spacexs-starship-megarocket-launching-to-orbit-for-1st-time-ever-on-sept-28-watch-it-live" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">SpaceX&#39;s Starship megarocket launching to orbit for 1st time ever on Sept. 28: Watch it live</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Space Money Flows To Proven Launch, Not Clever Niches</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">13</span>&amp;nbsp; the number of Starship test flights since 2023 before this week&#39;s first orbital attempt, the clearest measure of how much practice it takes to carry a Moon mission.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next five to ten years, the money in space keeps piling onto whoever can launch cheap and often, while the flashier side businesses struggle to prove they work. Government buyers, NASA&#39;s Moon plans and the military&#39;s satellite orders, are betting on a small number of reliable rockets, which means the winners are the launch companies and the firms building satellites that ride them.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeeze falls on ambitious startups trying hard tricks like repairing dead spacecraft in orbit, because one failed demo can erase years of runway before anyone pays.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week Starship aimed for its first orbital flight after 13 test flights since 2023, and NASA needs it fully working by 2028 for a crewed Moon landing, while SpaceX also flew military satellites for the Space Development Agency. Meanwhile Katalyst&#39;s rescue craft burned up in under three months.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Now public under SPCX, it carries Starship, Artemis hopes, and military satellite flights, sitting at the center of nearly every dollar.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Katalyst Space Technologies</strong> Its Link spacecraft disintegrated after failing to rescue a NASA telescope, showing how brutal the in-orbit repair business still is.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">General Matter</strong> Founded by an early SpaceX employee, it is borrowing the fast-build rocket approach for nuclear power with bipartisan backing.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the launch sites and the regions around them, like Vandenberg and Starbase, plus the satellite makers who fill each flight. No matter which rocket wins the orbital race, the Space Development Agency still needs hardware to put up there, and someone builds and integrates all of it.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Space Development Agency:</strong> Keeps buying batches of military satellites launched by SpaceX from Vandenberg, steady government money that rewards reliable launch.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">NASA Artemis:</strong> Has tied its crewed lunar landing to Starship by 2028, a huge public bet on a single rocket.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">General Matter:</strong> Attracting bipartisan support to apply SpaceX&#39;s build-fast approach to nuclear plants, a sign investors like the playbook beyond rockets.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This spills straight into energy. General Matter is taking the SpaceX habit of building, flying, and fixing fast and pointing it at nuclear power plants, so the rocket world&#39;s engineering culture is now trying to speed up America&#39;s slow nuclear revival.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect Starship&#39;s orbital results and more military satellite launches to decide whether the concentration bet strengthens or wobbles over the coming year.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If it plays out, a few proven launch companies anchor government space spending while risky niche services either prove themselves or quietly disappear.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Starship keeps slipping and misses the 2028 Artemis window, NASA and investors sour on the whole bet that one company can carry the Moon program, and the concentration story cracks.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Leaning everything on one rocket is risky, because Starship has flown 13 times without reaching orbit and NASA&#39;s 2028 deadline looks tight. If it slips, the whole concentrated bet looks less like strength and more like a single point of failure nobody planned around.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Katalyst Space Technologies and General Matter are both genuinely private, and this week shows the two sides of private space betting. Katalyst&#39;s burned-up rescue craft warns how fast money vanishes on hard demos, while General Matter&#39;s bipartisan support hints at where patient private capital is heading next.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Starship orbital result:</strong> A clean orbital flight proves the rocket is more than a test article and keeps Artemis on its schedule.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Next SDA satellite batches:</strong> More military launches from Vandenberg show steady government cash flowing to proven providers over unproven ones.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Servicing sector response to Katalyst:</strong> Whether other in-orbit repair startups raise money or stall tells you if investors still believe in that niche.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ea580c;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Space analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #059669;"><tr><td style="border-left:3px solid #059669;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#059669;">Longevity</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Longevity</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://image.cnbcfm.com/api/v1/image/108328514-1782803221665-gettyimages-2152722520-dsc00854.jpeg?v=1782803282&amp;w=1920&amp;h=1080" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:10px;">Longevity</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">Novartis signs $7.8 billion Abogen biotech licensing deal</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">Novartis has entered a licensing agreement with China-based Abogen Biosciences worth up to $7.8 billion, marking one of the largest recent tie-ups between Big Pharma and Chinese biotech firms. The deal reflects a growing trend of Western biopharma companies turning to China to source innovation as the industry&#39;s patent cliff approaches. The agreement centers on Abogen&#39;s lead asset and signals a major shift in global biotech dealmaking.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;"> t-size:0;"><img src="https://media.wired.com/photos/6abbe05edfaa177dfd594822/191:100/w_1280,c_limit/092926-Human%20Embryo%20Gene%20Editing.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:8px;">Longevity</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">A Biotech Founder Makes the Moral Case for Gene-Editing Human Embryos</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">WIRED</td><td style="padding-left:10px;"><a href="https://www.wired.com/story/biotech-founder-cathy-tie-moral-case-gene-editing-human-embryos/" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.cbsnews.com/news/sunlight-allergy-erythropoietic-protoporphyria-bitopentin/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Sun exposure left a woman in "insufferable pain" - until a clinical trial changed everything</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">CBS News</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.statnews.com/2026/10/01/health-news-trump-administration-appeals-ruling-blocking-student-visa-limits/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">International visas, GLP-1s for kids, Medicaid: Morning Rounds</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">STAT</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.statnews.com/2026/10/01/huntingtons-disease-uniqure-drug-study-results-patients/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Why a Huntington&#39;s patient isn&#39;t fazed by UniQure gene therapy&#39;s waning effect</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">STAT</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#042c20 0%,#065f46 52%,#08795b 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Longevity &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Big Pharma Goes Shopping in China for Its Next Act</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$7.8 billion</span>&amp;nbsp; the top value of Novartis&#39;s licensing deal for a single Chinese biotech&#39;s drug, among the largest such tie-ups yet.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The next decade of medicine gets written in two places at once: labs in China churning out drug candidates faster and cheaper, and the Western giants who license, run the trials, and sell worldwide. As blockbuster drugs lose patent protection and dry up, the companies that win are the ones good at buying promising science early and turning it into approved products, plus the precise, targeted treatments (gene therapies and cancer drugs aimed at one specific flaw) that command high prices.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeeze falls on Western early-stage biotechs that can no longer out-innovate cheaper rivals abroad.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Novartis just agreed to pay Abogen up to $7.8 billion to license a Chinese-developed drug, one of the biggest such tie-ups yet, while investors touring China&#39;s "Science City" come back stunned at the pace. That is the thesis in action: aging Western pipelines refilling themselves with imported science ahead of the patent cliff.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Novartis</strong> Betting billions on Chinese-sourced drugs to refill its pipeline, showing how Big Pharma now buys innovation rather than only growing it at home.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Abogen Biosciences</strong> The China-based biotech landing a deal worth up to $7.8 billion, proof that the best early science increasingly originates outside the West.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Kura Oncology</strong> JPMorgan sees roughly 180 percent upside on its targeted cancer drugs, the kind of precise, high-value therapy investors still pay up for.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The contract research shops and trial-running firms get paid whether the drug comes from China or Ohio, because somebody still has to test it in people. Every licensing deal, from Abogen&#39;s candidate to Yamo&#39;s autism drug, means more patients enrolled and more fees for the companies that manage the clinical plumbing.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Novartis, up to $7.8B:</strong> Licensed Abogen&#39;s lead drug, a bet that buying Chinese science beats racing an emptying pipeline toward the patent cliff.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">JPMorgan on Kura Oncology:</strong> Started coverage with a bullish call and a $30 target, flagging continued investor hunger for targeted cancer drugs.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This leans hard on AI. The pace coming out of China&#39;s Science City that stuns visiting investors is built partly on AI-driven drug discovery, so the same computing race fueling the AI force is quietly deciding who finds the next medicine first.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more Western pharma writing big checks for Chinese and precision drug candidates as patent expirations loom closer.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Medicine splits into a global sourcing game where whoever licenses and sells best, not who invents at home, captures the profits.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Washington restricts or taxes licensing deals with Chinese biotech over security or trade fears, the cheap-innovation pipeline into Western pharma narrows fast, and the whole buy-it-from-China strategy stalls.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Licensing early-stage drugs is a gamble, and plenty of these imported candidates will fail in trials after the headline deal fades. And the genetic treatments everyone is excited about keep raising hard questions, like UniQure&#39;s therapy whose benefit appears to wear off, which can gut the economics of a one-time cure.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Abogen Biosciences, the Chinese firm behind the $7.8 billion deal, is privately held, and it is the clearest window into where tomorrow&#39;s drugs come from. Watch too for private players like Yamo Pharmaceuticals and Origin Genomics, both running or pushing early human work that could become the next licensing prize.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>More China licensing deals:</strong> Another multibillion-dollar Western pharma tie-up with a Chinese biotech would confirm this is the new normal, not a one-off.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>UniQure durability data:</strong> Whether its Huntington&#39;s gene therapy&#39;s fading effect scares off investors will test appetite for pricey one-time genetic treatments.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>U.S. biotech policy moves:</strong> Visa, Medicaid, and any China-trade rules from the Trump administration could reshape where money and talent flow.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#059669;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Longevity analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #ca8a04;"><tr><td style="border-left:3px solid #ca8a04;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#ca8a04;">Energy &amp; Compute</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Energy &amp; Compute</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://image.cnbcfm.com/api/v1/image/108261167-1770188704196-gettyimages-2258106869-kokovlis-notitle260128_npA8a.jpeg?v=1790532614&amp;w=1920&amp;h=1080" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:10px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">China reportedly may let Alibaba and ByteDance buy new Nvidia chips</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">Beijing has signaled it may approve purchases of Nvidia&#39;s new RTX Pro 5500 chip for domestic companies including Alibaba and ByteDance. China&#39;s tech ministry recently asked some firms to report their plans for acquiring the professional-grade chip.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">CNBC</td><td style="padding-left:16px;"><a href="https://www.cnbc.com/2026/09/27/china-bytedance-alibaba-nvidia-chips.html" style="font-size:14px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://fortune.com/img-assets/wp-content/uploads/2026/10/AP26272855932529-e1791126738981.jpg?resize=1200,600" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Data center buildout pushes up costs of computers, graphics processors and memory chips</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Fortune</td><td style="padding-left:10px;"><a href="https://fortune.com/2026/10/04/esports-fortnite-pro-gaming-player-clix-twitch-mrbeast-philanthropy/" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://bloximages.chicago2.vip.townnews.com/journalstar.com/content/tncms/assets/v3/editorial/4/e8/4e85d269-45f0-4517-ac1f-c09ef4228af7/6ac0246300470.preview.jpg?crop=1763%2C926%2C0%2C124&amp;resize=1200%2C630&amp;order=crop%2Cresize" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Coffee Grounds Data LLC bought up 560 acres in Lincoln</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Lincoln Journal Star</td><td style="padding-left:10px;"><a href="https://journalstar.com/news/local/business/article_4e85d269-45f0-4517-ac1f-c09ef4228af7.html" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.foxnews.com/politics/neighborhood-backlash-collides-americas-tech-arms-race-plan-fix-it" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Virginia congressman pitches federal plan to ease data center backlash</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Fox News</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://oilprice.com/Energy/Energy-General/The-AI-Data-Center-Boom-Faces-a-New-Reality-Check.html" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The AI Data Center Boom Faces a New Reality Check</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">OilPrice</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://decrypt.co/379400/bitcoins-quantum-problem-three-ways-researchers-are-trying-to-fix-it" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Bitcoin&#39;s Quantum Problem: Three Ways Researchers Are Trying to Fix It</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Decrypt</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#2e1604 0%,#5c330d 52%,#875010 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Energy &amp; Compute &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Power And Permits, Not Chips, Now Decide The Winners</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">2035</span>&amp;nbsp; the year China is on pace to overtake the US and France in nuclear power generation, backed by a new IAEA deal to share reactor technology.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">For years the story was about who could buy the most Nvidia chips, but the real squeeze is shifting to whoever can actually deliver electricity and win local approval to build. Over the next five to ten years the money flows to the boring, hard-to-copy stuff: power plants (increasingly nuclear), the utilities that control the grid connection, and the construction trades that pour the concrete.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The companies that announced giant data center plans without locked-in power and permits are the ones who get squeezed when a fraction of that pipeline gets built.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week utilities and regulators started imposing tougher data center rules while a year of hype produced only a fraction of approved projects, and towns from San Jose to Hobart fought over whether to welcome or ban them. Meanwhile China is on pace to pass the US and France in nuclear power by 2035.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Still the chip everyone wants, with Beijing possibly clearing Alibaba and ByteDance to buy its RTX Pro 5500, but chips mean nothing without power to run them.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon</strong> Its Hobart data center is already paying the town windfall economic impact money, showing the winners are those who lock in local goodwill and power early.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Alibaba &amp; ByteDance</strong> China may let them buy new Nvidia chips, keeping them in the race, though they carry the risk of Beijing changing its mind.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the union electricians and construction trades filling northeastern Pennsylvania with stable jobs. Whether the winning company is Amazon, a utility, or a nuclear developer, someone has to wire and pour every one of these buildings, and those crews get paid regardless.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Alibaba &amp; ByteDance:</strong> Beijing may approve their purchases of Nvidia&#39;s new RTX Pro 5500 chip, keeping China&#39;s biggest AI players supplied and Nvidia&#39;s revenue flowing.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon, Hobart:</strong> Its still-unfinished data center is already cutting economic impact payments to the town, buying the local acceptance that decides whether these projects get built.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands straight on the AI force: if power and permits cap how many data centers get built, the frontier labs racing to train ever-bigger models hit a physical wall no amount of funding can climb. Jensen Huang can dismiss doomsday warnings all he wants, but the grid quietly sets the pace.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more local fights, tougher utility rules, and quiet cancellations that reveal how much of the announced buildout was never real.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Nuclear power and grid access become the scarce prize, and whoever controls electricity, led increasingly by China, holds the leverage over compute.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If utilities quietly find the power and regulators wave projects through, the whole pipeline gets built and the bottleneck vanishes, making cheap chips and capital the winners again rather than scarce electricity and permits.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The crowd betting on scarce power may be early: chips get approved, hyperscalers have the cash to build their own generation, and today&#39;s permitting fights fade as towns like Hobart discover the tax money is too good to refuse. If most of the pipeline eventually gets built, the reality check was just a delay, not a ceiling.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The pre-IPO angle is thin this week, since the biggest names driving this story, Nvidia, Amazon, and Alibaba, already trade publicly. The private action sits with the smaller nuclear developers and regional power projects that will supply these data centers, none named clearly enough here to track yet.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>San Jose data center rules:</strong> Whether the city writes workable citywide regulations or drifts toward the pauses and bans its Bay Area neighbors chose tells you how hard local approval gets.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>China chip approvals:</strong> Formal sign-off letting Alibaba and ByteDance buy Nvidia&#39;s RTX Pro 5500 would show Beijing values keeping its firms competitive over pure self-reliance.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Utility data center tariffs:</strong> New rate rules that make data centers pay for their own grid upgrades would confirm power access, not chips, is now the gate.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ca8a04;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Energy &amp; Compute analysis on the site &amp;rarr;</a></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(135deg,#1e3a5f 0%,#0f172a 100%);"><tr><td style="padding:40px 32px;text-align:center;"><p style="margin:0 0 8px;font-size:23px;font-weight:700;letter-spacing:-0.022em;color:#ffffff;">Share the Atomic Five.</p><p style="margin:0 0 26px;font-size:17px;line-height:1.55;color:rgba(255,255,255,0.6);">Forward this to one person who should know where humanity is headed.</p><table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;"><tr><td style="background:#2563eb;border-radius:980px;"><a href="https://atomicmediagroup.ai/i/2026-10-05.html" style="display:inline-block;padding:12px 26px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;">Read on Web</a></td><td style="width:12px;"></td><td style="background:rgba(255,255,255,0.12);border-radius:980px;"><a href="https://atomicmediagroup.ai" style="display:inline-block;padding:12px 26px;font-size:16px;font-weight:600;color:rgba(255,255,255,0
