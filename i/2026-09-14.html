g:11px 0;border-top:1px solid #ececf0;"><a href="https://thenextweb.com/news/anthropic-settlement-authors-publishers-payout-split" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Authors say publishers want a cut of Anthropic&#39;s payout, the NYT reports</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">TNW</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#0b1424 0%,#16345c 52%,#1d488f 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Artificial Intelligence &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Washington Bets On Speed As AI&#39;s Safety Fight Goes Public</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$1.5 billion</span>&amp;nbsp; what Anthropic agreed to pay authors whose books trained its models, at $3,000 per book, now being fought over by publishers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The next decade of AI gets shaped as much in Washington as in the labs, and America has now picked its side: go fast, stay ahead of China, regulate later. That&#39;s great news for the companies building the biggest models and the government contractors wiring AI into defense and spying, and it squeezes anyone counting on rules to protect them, from authors whose books got scraped to smaller players hoping for a fair fight.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners will be the firms with the compute, the government relationships, and the lawyers to absorb the fallout.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Trump said flatly "We&#39;re leading China in AI" and waved off slowdown calls, Speaker Mike Johnson rejected an AI moratorium on live TV, and the NSA launched its biggest reshuffle in over a decade with a dedicated AI unit. Meanwhile even OpenAI&#39;s own chief scientist warned agents could hack and blackmail, showing the safety fight is now fully public.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Says it built an "automated research intern" and won&#39;t IPO in 2026, staying private while its own scientists warn its agents could go rogue.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> CEO Dario Amodei is leading the slowdown push while the company pays $1.5 billion to authors, showing caution and legal exposure at once.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Meta</strong> Pushing next-gen VR and AI glasses due next year, betting the winning bet is consumer hardware people actually wear, not just models.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The defense and intelligence contractors quietly wiring AI into government win no matter which lab leads. The NSA&#39;s new AI unit needs someone to build and secure those systems, and that work gets paid whether OpenAI or Anthropic ends up on top.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic, $1.5B:</strong> A settlement paying authors $3,000 per book, the first real price tag on scraping copyrighted text, now contested by publishers and agents wanting a cut.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI:</strong> Ruling out a 2026 IPO, Altman keeps the most valuable AI lab private and dependent on backers rather than public markets for its enormous compute bills.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into energy. Washington&#39;s bet on outracing China means no brake on the giant data centers these models need, so the real bottleneck becomes power generation, and whoever can deliver electricity at scale ends up holding the leverage over AI&#39;s growth.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect Washington to keep blocking AI rules while safety warnings from insiders get louder and the courts sort out copyright.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the go-fast bet holds, a handful of well-connected labs and defense contractors control AI, with regulation arriving only after a crisis forces it.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">A high-profile AI failure or a rogue-agent incident like the one OpenAI&#39;s chief scientist described could flip the political mood overnight, handing regulators the mandate Trump and Johnson are now refusing to give them.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Washington cheering for speed doesn&#39;t mean the money follows, and if these models keep costing fortunes while the killer consumer product stays elusive, the go-fast crowd could be funding a very expensive race to nowhere. The people warning loudest about danger are the same insiders building the tech, which reads more like managing hype than a real emergency.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">OpenAI is the name to watch, and Altman just said no IPO in 2026, calling it an "ill-advised moment to go public." That keeps the most important AI company private and out of reach for ordinary investors, funded instead by deep-pocketed backers who set the terms.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Congress-tech safety meeting:</strong> Johnson floated tech leaders sitting with Congress on guardrails, and whether that produces real rules or theater tells you how long the go-fast window stays open.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Anthropic settlement fight:</strong> How the $1.5 billion gets split between authors, publishers, and agents sets the price tag for training on copyrighted work going forward.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>NSA AI unit stand-up:</strong> How fast the agency&#39;s new AI mission director starts buying and building shows whether government becomes a major AI customer or just talks.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radi e digging with empty cabs</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Fox News</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#170833 0%,#341563 52%,#552aa0 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Robotics &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Robot Brains And Training Data Beat Robot Bodies</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$500 million</span>&amp;nbsp; the valuation Sequoia is backing for Mecka AI, a company that only collects human motion data to train robots.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The real money in robotics is moving away from the machine you can see and toward the invisible parts: the training data that teaches robots how to move, and the software that lets them work with nobody at the controls. The winners will be the companies that collect human motion data at scale, the ones that put working robots on real job sites and get paid for finished work, and cheap hardware makers who let everyone else build on top.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The people who just sell a fancy metal body get squeezed.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week Mecka AI closed near a $500 million round led by Sequoia purely to gather human motion data for training humanoids, while Bedrock Robotics ran autonomous excavators with empty cabs on live sites in Texas and Nevada. Both point the same way: teaching and doing beat building the body.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Mecka AI &amp; Sequoia</strong> Raising around $500 million to collect the human motion data that trains humanoids, betting the teaching material is worth more than the robot.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Bedrock Robotics</strong> Running excavators with no operator in the cab on active Texas and Nevada sites, proving robots can bill for real, finished construction work.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Unitree</strong> Selling a $4,000 quadruped robot dog from China, making cheap capable hardware that anyone can build software and businesses on top of.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch Nvidia. Whether the winning robot brains come from Mecka&#39;s data, Bedrock&#39;s excavators, or the alumni startups it seeded, they all train and run on Nvidia&#39;s chips, so the chip maker gets paid regardless of which robot company wins.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Sequoia, ~$500M:</strong> Leading Mecka AI&#39;s round for robot training data, a bet that the teaching material matters more than the machine itself.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia alumni:</strong> Founders leaving the chip giant to start Flexion Robotics and INT21, carrying insider knowledge of the software brains robots run on.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Bedrock Robotics:</strong> Putting autonomous excavators to work on paying construction sites, turning robotics from a promise into billed labor.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. Mecka&#39;s motion data and Bedrock&#39;s self-driving excavators are AI models wearing a body, which means the same data-and-model race running in software is now spreading into physical machines that dig, walk, and lift.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more paid real-world deployments like Bedrock&#39;s empty-cab excavators, and more big checks written for robot training data.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> The companies that own the data and the brains, plus cheap hardware makers, dominate while pure body builders become interchangeable suppliers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the empty-cab machines stumble on safety or reliability at real construction sites, buyers pull back and the whole &#39;robots doing paid work today&#39; story slips years into the future, starving the data and software bets of revenue.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Collecting motion data is easy to fund and hard to turn into robots that reliably do useful work, so a $500 million bet on data could sit on the shelf for years. And Unitree shows the hardware itself is getting cheap fast, which means real money may stay stubbornly out of reach for everyone.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Mecka AI, Bedrock Robotics, and the Nvidia-alumni startups Flexion Robotics and INT21 are all private, and China&#39;s Unitree sits outside easy reach too. Mecka&#39;s Sequoia-led round is the clearest name to track, since whoever owns the training data may end up owning the economics before any of these ever list.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Mecka AI round closes:</strong> A confirmed Sequoia-led close near $500 million would show investors are paying up for training data, not robot hardware.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Bedrock site expansion:</strong> More paid earthwork contracts beyond Texas and Nevada would prove empty-cab machines are a business, not a demo.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Nvidia alumni startups:</strong> Early traction at Flexion Robotics and INT21 would show where the chip giant&#39;s best robotics talent thinks the money is.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#7c3aed;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Robotics analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #ea580c;"><tr><td style="border-left:3px solid #ea580c;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#ea580c;">Space</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Space</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.arstechnica.net/wp-content/uploads/2026/09/Spectrum_mission_Onwards_and_upwards_liftoff_pillars-1152x648.jpg" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:10px;">Space</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">German company becomes first in Europe to launch fully commercial orbital rocket</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">Isar Aerospace, founded in 2018 by three students at a German university, successfully launched its Spectrum rocket into low-Earth orbit from a Norwegian spaceport inside the Arctic Circle. The two-stage rocket became Europe&#39;s first entirely privately-developed vehicle to reach orbit. The milestone marks a major leap for European commercial spaceflight, achieved in just a few years compared to decades of traditional industry development.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">Ars Technica</td><td style="padding-left:16px;"><a href="https://arstechnica.com/space/2026/09/german-company-becomes-first-in-europe-to-launch-fully-commercial-orbital-rocket/" style="font-size:14px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://media.thenextweb.com/2026/05/spacex-bridge-loan-musk-debt-refinancing-ipo.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Elon Musk&#39;s quietest investor has built a $40B SpaceX stake</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">TNW</td><td style="padding-left:10px;"><a href="https://thenextweb.com/news/vy-capital-spacex-stake-europe" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.mos.cms.futurecdn.net/VFNbSpiTiUW4ogrZTkKAwU-2560-80.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">NASA astronaut Jessica Meir shares zero-G curly hair tips from the ISS (video)</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Space.com</td><td style="padding-left:10px;"><a href="https://www.space.com/space-exploration/international-space-station/nasa-astronaut-jessica-meir-shares-zero-g-curly-hair-tips-from-the-iss-video" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.theverge.com/science/990906/isar-aerospace-europe-orbital-rocket-launch" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Europe has its first commercial orbital rocket</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">The Verge</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/on-this-day-in-space-september-6-2026" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">On this day in space! Sept. 6, 1947: The US Navy launches 1st V-2 rocket at sea in ballistic missile test</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/launches-spacecraft/spacex-starlink/group-15-24-launch-ocisly" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video)</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Cheap Reliable Launch Decides Who Owns Space</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$40 billion</span>&amp;nbsp; what a four-person Dubai firm&#39;s 3.4% SpaceX stake is worth, more than double the cost of Europe&#39;s entire planned Starlink rival.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">For the next decade the money in space flows to whoever can put things in orbit cheaply, often, and on their own terms, and right now that means a small club led by SpaceX with everyone else racing to catch up. The winners are the companies that own both the rockets and the satellite networks they carry, because launching your own broadband beats renting a competitor&#39;s ride.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeezed are old-line launch providers and government-backed projects that show up late and underfunded, no matter how strategically important they claim to be.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Germany&#39;s Isar Aerospace reached orbit with Europe&#39;s first fully commercial rocket, proof that a 2018 startup can do in a few years what took legacy industry decades. Meanwhile SpaceX, now public at a $2 trillion valuation after its June IPO, kept flinging up Starlink batches and posted 92% revenue growth, showing how far ahead the leader already sits.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Public since June at a $2 trillion valuation, flying constant Starlink launches with 92% revenue growth, the pace everyone else measures themselves against.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Isar Aerospace</strong> The German startup that just gave Europe its first privately built rocket to orbit, showing homegrown launch is finally possible without decades of state work.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Rocket Lab</strong> Still the clearest number two in commercial launch, holding its spot as fresh rivals like Isar start crowding in below SpaceX.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The spaceports themselves quietly get paid regardless of which rocket wins. Isar flew from a Norwegian site inside the Arctic Circle, and as more startups need places to launch, the operators of these remote pads collect on everyone&#39;s ambitions.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Vy Capital, $40B:</strong> A tiny Dubai firm now sits as SpaceX&#39;s fifth-largest shareholder, ahead of Sequoia and Andreessen Horowitz, a sign of how deep private capital is piling in.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Europe&#39;s sovereign constellation:</strong> Its rival satellite network costs less than half that single stake and won&#39;t launch until 2030, showing how badly Europe is outspent.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX, $2 trillion:</strong> The June IPO valued the leader at roughly 100 times sales, a bet that its launch and Starlink lead keeps widening for years.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week the same names driving space, with Musk joining OpenAI&#39;s Altman and Anthropic&#39;s Amodei, publicly called for a slowdown in AI development over safety. That ties space directly to AI: the people building rockets and satellite networks are also steering how fast artificial intelligence advances.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more Isar-style startup launches worldwide and constant scrutiny of whether SpaceX&#39;s stock justifies its enormous valuation.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Launch becomes cheap and routine, a handful of players own the orbital networks, and latecomers pay them for access.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If SpaceX&#39;s cadence stumbles on safety or its $2 trillion, near-100-times-sales valuation cracks under a market shift, the whole thesis that one leader keeps compounding its lead would suddenly look fragile.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">SpaceX trading near 100 times sales assumes years of flawless execution, and even a strong company can be a poor investment if the price already bakes in perfection. Isar&#39;s single success proves Europe can launch, but one orbital flight is a long way from the reliable, high-volume operation needed to actually challenge the leader.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Isar Aerospace is the private name to track, a 2018 startup that just did what Europe&#39;s legacy industry couldn&#39;t. You can&#39;t buy it yet, but its progress will shape whether the continent builds real independence from SpaceX or stays a paying customer for years.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Isar&#39;s second launch:</strong> A repeat orbital success would prove the first flight was real capability, not a one-off, and give Europe a credible commercial option.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Europe&#39;s sovereign broadband funding:</strong> Whether the continent puts real money behind its Starlink rival before 2030 tells you if it stays a customer or becomes a competitor.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>SpaceX quarterly revenue:</strong> Another growth print near 92% would justify  0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the diagnostics and data-tracking companies feeding LA&#39;s longevity obsession. Whether the winning treatment is a gene therapy or a fat-cell facial, someone has to measure, monitor, and track patients before and after, and those testing and wearable-data firms get paid across every camp.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">University of Michigan, $258.7M:</strong> Federal grants pouring into cancer and aging research keep the academic pipeline that startups eventually commercialize well funded.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Incyte:</strong> Institutional investors are accumulating shares in a profitable biotech, showing big money still prefers approved products to early-stage bets.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Massachusetts (Healey):</strong> The governor&#39;s meeting with tiny biotech CEOs flags a funding gap for firms under ten people that could starve the next wave of cures.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. The LA longevity scene runs on wearable data and diagnostics, and all that health data becomes the fuel for AI models that flag disease early, meaning the wellness craze quietly builds the training sets that make AI-driven medicine possible.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more insurance coverage decisions on gene therapies and early FLASH trial data to separate real medicine from wellness froth.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Longevity becomes reimbursed mainstream medicine, with approved gene and radiation therapies as standard care and the consumer hype shaking out.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If insurers start refusing to cover pricey gene and radiation therapies because budgets buckle, the whole thesis stalls, since a breakthrough nobody will pay for never becomes a real business.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The wellness boom the skeptics point to is huge and self-funding, and consumers happily pay cash for supplements and diagnostics that never need an insurer&#39;s blessing. Meanwhile the approved therapies are so expensive that coverage stays rare, so the covered-cure story could grow far slower than the hype-driven consumer money the crowd dismisses.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">CERM, out of the University of Delaware&#39;s STAR Campus, is the genuinely private name here, developing a stem-cell cosmetic procedure using a patient&#39;s own fat cells. It matters as a test of whether academic longevity science can become a real consumer business, though it rides the same hype wave the sober money distrusts.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Penn FLASH trial readouts:</strong> Early results on side-effect reduction would tell you whether precision radiation graduates from milestone to marketable standard of ng monitors don&#39;t just need more Hz</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Digital Trends</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#2e1604 0%,#5c330d 52%,#875010 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Energy &amp; Compute &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Power And Politics, Not Chips, Now Decide The Winners</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$99 billion</span>&amp;nbsp; the value of Nvidia&#39;s stakes in the companies that buy its chips, up fourteenfold in a single year.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next decade the scarce thing isn&#39;t the chip, it&#39;s the electricity and the local permission to plug in, so the money flows to whoever can lock up power, land, and cooling water years ahead of time. Nvidia is spreading cash into its own customers to keep chip demand humming, which means the companies that quietly build and power the buildings get paid no matter which AI lab wins.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The builders who can&#39;t secure power or calm angry neighbors get squeezed hard.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week OpenAI&#39;s Stargate Korea project with Samsung and SK stalled nearly a year in over sites, power, and funding, while an Indiana water permit for an Amazon data center drew activist fire and data centers split Democrats heading into the midterms. Meanwhile Nvidia&#39;s stakes in its own buyers hit $99 billion, up fourteenfold, showing where the confidence still sits.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> It&#39;s funding its own customers, from a $5-6bn Thinking Machines round to chip approvals used in a peace deal, keeping demand flowing.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI, Samsung &amp; SK</strong> Their stalled Stargate Korea project shows the hard limit: even flush AI ambitions freeze when power and site deals won&#39;t close.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon</strong> Its Indiana data center, tangled in a contested water permit, is the test case for whether communities let this buildout continue.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the utilities and gas-plant builders like NIPSCO, whose Schahfer station is being expanded to feed an Amazon site. Whoever generates and delivers the electricity gets paid on long contracts no matter which AI company thrives or flops.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nscale, $3.5B:</strong> It agreed to supply the robot maker Figure with at least that much compute while also buying a stake, tying compute money directly to robotics.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia (via Thinking Machines, $5-6B):</strong> Nvidia is putting up roughly half of Mira Murati&#39;s giant round, another bet on a customer that will buy its chips.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia, $99B portfolio:</strong> Half its stakes sit in private customers, a web of investments designed to keep chip demand from ever cooling.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This shows up straight in robotics: Nscale&#39;s $3.5 billion compute deal with Figure and its equity stake mean humanoid robots now depend on the same power-hungry data centers, so the electricity crunch becomes the robot industry&#39;s ceiling too.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more stalled megaprojects and louder local fights over water and power as builders collide with communities and slow grids.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> The lasting winners will be whoever owns power generation, land, and grid access, with chipmakers renting them the demand.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If local moratoriums, water fights, and midterm politics harden into real bans on
