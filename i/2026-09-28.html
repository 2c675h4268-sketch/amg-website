9;s great news for the companies building the biggest models and the government contractors wiring AI into defense and spying, and it squeezes anyone counting on rules to protect them, from authors whose books got scraped to smaller players hoping for a fair fight.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners will be the firms with the compute, the government relationships, and the lawyers to absorb the fallout.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Trump said flatly "We&#39;re leading China in AI" and waved off slowdown calls, Speaker Mike Johnson rejected an AI moratorium on live TV, and the NSA launched its biggest reshuffle in over a decade with a dedicated AI unit. Meanwhile even OpenAI&#39;s own chief scientist warned agents could hack and blackmail, showing the safety fight is now fully public.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Says it built an "automated research intern" and won&#39;t IPO in 2026, staying private while its own scientists warn its agents could go rogue.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> CEO Dario Amodei is leading the slowdown push while the company pays $1.5 billion to authors, showing caution and legal exposure at once.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Meta</strong> Pushing next-gen VR and AI glasses due next year, betting the winning bet is consumer hardware people actually wear, not just models.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The defense and intelligence contractors quietly wiring AI into government win no matter which lab leads. The NSA&#39;s new AI unit needs someone to build and secure those systems, and that work gets paid whether OpenAI or Anthropic ends up on top.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic, $1.5B:</strong> A settlement paying authors $3,000 per book, the first real price tag on scraping copyrighted text, now contested by publishers and agents wanting a cut.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI:</strong> Ruling out a 2026 IPO, Altman keeps the most valuable AI lab private and dependent on backers rather than public markets for its enormous compute bills.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into energy. Washington&#39;s bet on outracing China means no brake on the giant data centers these models need, so the real bottleneck becomes power generation, and whoever can deliver electricity at scale ends up holding the leverage over AI&#39;s growth.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect Washington to keep blocking AI rules while safety warnings from insiders get louder and the courts sort out copyright.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the go-fast bet holds, a handful of well-connected labs and defense contractors control AI, with regulation arriving only after a crisis forces it.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">A high-profile AI failure or a rogue-agent incident like the one OpenAI&#39;s chief scientist described could flip the political mood overnight, handing regulators the mandate Trump and Johnson are now refusing to give them.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Washington cheering for speed doesn&#39;t mean the money follows, and if these models keep costing fortunes while the killer consumer product stays elusive, the go-fast crowd could be funding a very expensive race to nowhere. The people warning loudest about danger are the same insiders building the tech, which reads more like managing hype than a real emergency.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">OpenAI is the name to watch, and Altman just said no IPO in 2026, calling it an "ill-advised moment to go public." That keeps the most important AI company private and out of reach for ordinary investors, funded instead by deep-pocketed backers who set the terms.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong t-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Unix AI</strong> Chinese humanoid maker expanding globally and readying an IPO, betting chip export limits won&#39;t matter, the clearest example of China pressing its scale advantage.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Zebra Technologies</strong> Public firm pushing physical AI beyond data centers, with earnings up 76%, positioned to sell the scanning and sensing robots depend on.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Faraday Future</strong> Just launched nine EAI robotics configurations across five models, an EV maker trying to reinvent itself as a robotics player, carrying the execution risk.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the sensing and scanning suppliers like Zebra Technologies, which get paid whether the robot on the line is Chinese, American, or European. Every machine that has to see, sort, and track needs their gear, so they collect regardless of which brand wins the deployment race.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Unix AI:</strong> Planning a future IPO to fund global expansion, a bid to turn China&#39;s manufacturing lead into public-market cash.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">PitPro Automation:</strong> San Francisco startup put its first tire-changing robot into a Calgary shop, an early sign niche labor-shortage robots can find paying customers.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Zebra Technologies:</strong> Reinvesting behind physical AI as earnings jump 76%, backing the picks-and-shovels side of the robot buildout.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. Robots are just bodies until the software can see and decide, so China&#39;s hardware lead only pays off if it pairs with capable AI models, which is exactly what U.S. chip export controls are meant to choke.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more Chinese humanoid launches and IPO chatter while Western makers lean on defense and niche labor-shortage jobs.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If China&#39;s scale holds, the world buys mostly Chinese robots, and Western firms survive by owning the software and sensors inside them.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If U.S. chip export controls actually bite and starve Chinese humanoid makers of the processors they need, Unix AI&#39;s confidence looks misplaced and the scale lead stalls, handing Western and allied makers room to catch up.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Counting installed robots rewards volume, not profit, and a lot of China&#39;s numbers come from subsidized local demand that may not translate into money-making global champions. Cheap humanoids that impress in demos still struggle with the messy, unpredictable work that makes them useful, so the scale lead could be years of losses, not winnings.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Unix AI is the private name to track, a Chinese humanoid maker openly readying an IPO while expanding abroad, so a filing would let outsiders finally price the China robot bet. PitPro Automation is the smaller private story, proving narrow, labor-strapped tasks can pay before general-purpose humanoids arrive.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Unix AI IPO filing:</strong> Whether it files and where it lists shows how much capital China&#39;s humanoid push can pull from public markets.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>IFR 2026 regional breakdown:</strong> Any sign Europe or the U.S. reverses the installation slump would test the China-dominance story.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Navy RASWDC first contracts:</strong> Early tactics and vendor picks reveal whether Western robotics money is flowing into defense and autonomy.</td></tr></table></td></tr></table></td></tr></ -left:10px;"><a href="https://www.space.com/space-exploration/on-this-day-in-space-september-27-2026" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://ca-times.brightspotcdn.com/dims4/default/64e287b/2147483647/strip/true/crop/2400x1260+0+0/resize/1200x630!/quality/75/?url=https%3A%2F%2Fcalifornia-times-brightspot.s3.amazonaws.com%2Fdf%2F45%2F57d858144a2a88575fa2b03080bb%2Flatlogo-ss.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Spacecraft burns up in atmosphere after failing to rescue NASA telescope</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Los Angeles Times</td><td style="padding-left:10px;"><a href="https://www.latimes.com/science/story/2026-09-27/spacecraft-burns-up-in-atmosphere-after-failing-to-rescue-nasa-telescope" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.politico.com/news/2026/09/27/the-startup-bringing-the-spacex-playbook-to-nuclear-power-01084143" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The startup bringing the SpaceX playbook to nuclear power</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">POLITICO</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/launches-spacecraft/spacexs-starship-megarocket-launching-to-orbit-for-1st-time-ever-on-sept-28-watch-it-live" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">SpaceX&#39;s Starship megarocket launching to orbit for 1st time ever on Sept. 28: Watch it live</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/astronomy/asteroids/asteroid-samples-from-nasas-epic-osiris-rex-mission-show-bennu-was-born-from-fire-and-ice" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Asteroid samples from NASA&#39;s epic OSIRIS-REx mission show Bennu was born from fire and ice</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Starship&#39;s Orbital Try Puts SpaceX Above A Crowded Field</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">13 Starship prototypes flown since 2023</span>&amp;nbsp; nearly half ending in unintended explosions, the price of learning to build a reusable giant rocket.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Cheap, reusable launch is about to stop being a promise and become plumbing, and the companies that own the rockets and the satellites riding on them will make the real money over the next decade. As SpaceX pushes Starship toward orbit, the winners are the few outfits with proven hardware and paying customers, while the squeeze falls on startups selling one clever trick without a working flight record.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The safest bet is on companies that launch often, land reliably, and already sell a service people pay for, like rural internet.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">SpaceX aimed Starship&#39;s 14th test at orbit on September 28, its first attempt after 13 flights since 2023 with nearly half ending in explosions, and Morgan Stanley flagged its publicly traded stock (SPCX) as attractive on weakness. Meanwhile Katalyst&#39;s Link spacecraft burned up after failing to rescue a NASA telescope.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Now public under SPCX, it is chasing Starship&#39;s first orbit while its Starlink service dominates satellite internet, the strongest hand in the field.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">EchoStar</strong> Flagged alongside SpaceX by Morgan Stanley as attractive, a satellite operator investors are betting can hold ground as launch costs fall.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Katalyst Space Technologies</strong> Its Link spacecraft burned up after failing to rescue a NASA telescope, a warning that in-orbit servicing startups still carry brutal technical risk.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Look at the chip suppliers. SiTime, named alongside SpaceX by Morgan Stanley, makes precision timing parts that satellites and spacecraft need regardless of which rocket company wins, getting paid on volume as more hardware goes up.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Morgan Stanley:</strong> The bank told investors SpaceX, SiTime and EchoStar look attractive to buy on weakness, keeping Wall Street money pointed at commercial space.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">General Matter:</strong> A SpaceX-alumni startup drew bipartisan backing to bring the fast, iterate-and-fail approach to nuclear power, showing that playbook attracting capital beyond rockets.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week&#39;s clearest ripple runs into energy: General Matter, co-founded by an early SpaceX employee, is taking Musk&#39;s build-fast-and-iterate approach into nuclear power, drawing bipartisan support amid a nuclear revival. The same engineering culture that cheapened rockets is now aimed at reactors.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect the Sept. 28 Starship orbital result to set the mood for every space stock and startup for months.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If reusable heavy launch becomes routine, a handful of proven operators own space access while weak single-trick startups quietly disappear.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Starship&#39;s orbital attempt fails badly or slips again, the whole promise of cheap reusable launch stays theoretical, and the premium investors are paying for SpaceX and its imitators looks early.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">SpaceX has blown up nearly half its Starship prototypes, so treating orbit as a done deal ignores how hard and expensive the last steps are. And if cheap launch really arrives, a flood of copycat satellite services could turn space internet into a low-margin grind where nobody makes much.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">General Matter, the private startup founded by an early SpaceX employee, is worth tracking as it brings the rocket world&#39;s iterate-fast method to nuclear power with bipartisan backing. Most of the big space names in this week&#39;s reporting, including SpaceX itself, already trade publicly, so the pure pre-IPO angle here is thin.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Starship orbital attempt, Sept. 28:</strong> Reaching orbit on the 14th flight would prove reusable heavy launch works and reset expectations for the whole field.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Starlink competitor pricing:</strong> Whether the five cheaper alternatives to Starlink win rural customers shows if satellite internet becomes a real price fight.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Space servicing rebound:</strong> The next in-orbit rescue or refueling demo after Katalyst&#39;s failure tests whether that business is viable at all yet.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ea580c;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Space analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #059669;"><tr><td style="border-left:3px solid #059669;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#059669;">Longevity</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Longevity</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://npr.brightspotcdn.com/dims3/default/strip/false/crop/3 >NIH cuts delayed a cancer trial. Patients lost time they didn&#39;t have</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">CNBC</td><td style="padding-left:10px;"><a href="https://www.cnbc.com/2026/09/25/nih-cuts-delayed-a-cancer-trial-patients-lost-time-they-didnt-have.html" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://endpoints.news/biotechs-best-startups-of-2026-meet-this-years-endpoints-11/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Meet this year&#39;s Endpoints 11</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Endpoints News</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.wbrz.com/news/tuesday-health-report-new-astrazeneca-drug-may-be-first-to-reduce-copd-symptoms-fda-approval-sought" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Tuesday Health Report: New AstraZeneca drug may be first to reduce COPD symptoms, FDA approval sought</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">WBRZ</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.europesays.com/3273934/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Driven Drug Development Faces a Real Test... The Key Lies in Experimental Data [Weekend Money]</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#042c20 0%,#065f46 52%,#08795b 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Longevity &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">RNA Medicine And Proprietary Data Win The Next Decade</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$446.3 million</span>&amp;nbsp; what ADARx raised in its upsized IPO, with shares opening about 30 percent above the offering price.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next five to ten years the money in longevity flows to companies that own two things: validated RNA-based medicines (drugs that use genetic messages to treat disease) and hard-to-copy biological data. The public market has reopened for biotech, so proven platforms can finally raise real cash, while the AI drug-discovery race is being decided by who controls unique experimental data, not who has the fanciest algorithm.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Firms leaning on government grants or making slightly-better copycat drugs get squeezed hardest.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">ADARx raised $446.3 million in an upsized IPO and opened 30 percent above its price, RNAi player City Therapeutics filed to go public, and Penn&#39;s late-stage mRNA cancer vaccine succeeded, with Nobel laureate Drew Weissman calling RNA in cancer&#39;s future enormous. Meanwhile NIH cuts delayed a pediatric cancer trial, showing who gets left behind.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ADARx Pharmaceuticals</strong> Its $446 million Nasdaq debut, opening 30 percent up, proves investors will pay big for late-stage gene therapy with a real pipeline.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">AstraZeneca</strong> Seeking FDA approval for tozorakimab, an antibody it says cuts COPD symptoms over 30 percent, chasing one of the world&#39;s top killers.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Eli Lilly</strong> Won FDA approval for a weekly insulin shot, cementing its lead in chronic metabolic disease where recurring demand is huge.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the law firms and specialized dataset owners who get paid on every deal. Cooley and Latham &amp; Watkins guided ADARx&#39;s offering, and the firms sitting on unique biological data become the ones pharma must pay regardless of which drug wins.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ADARx, $446.3M:</strong> An upsized Nasdaq IPO priced at the top of its range, the clearest sign the biotech public window is wide open again.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">City Therapeutics:</strong> The RNAi developer filed for an IPO, showing investor money keeps chasing RNA-based medicine specifically.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Pharma-tech AI deals:</strong> Global drugmakers are expanding AI partnerships with big tech, but the prize is proprietary biological data, not the software itself.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into AI. The reporting says the AI drug-discovery race is now decided by who controls proprietary experimental data, so the biotech firms generating unique biological datasets quietly become the fuel that determines which AI models actually produce working medicines.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more biotech IPOs and RNA-focused filings over the next year as the reopened public market keeps rewarding proven pipelines.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Within a decade RNA medicines and data-rich drug developers dominate, while grant-dependent labs and copycat drugmakers fade from the money.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the reopened public market cools and RNA readouts start missing, or if AI drug programs keep failing in the clinic despite the hype, the flood of capital reverses and only a handful of proven names survive.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Hot IPOs and one good mRNA readout do not make a trend, and biotech has burned investors before when early excitement met years of clinical failures. AI-driven discovery has produced plenty of promising molecules that flopped in humans, so the data-is-king story could take a decade to pay off, if it ever does.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">City Therapeutics is the private name to track: it has filed for an IPO but is not yet trading, and how it fares will show whether investor hunger for RNA medicine extends beyond a couple of standout debuts. Its pricing sets the tone for the next wave of RNA startups.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Tozorakimab FDA decision:</strong> An approval would confirm big pharma can still deliver first-of-kind drugs for massive chronic-disease markets.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>City Therapeutics IPO pricing:</strong> How it prices tests whether investor appetite for RNA medicine runs deep or is limited to a few hot names.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>NIH funding restorations:</strong> Whether delayed trials like the DIPG study resume shows how badly grant cuts are hollowing out early research.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#059669;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Longevity analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #ca8a04;"><tr><td style="border-left:3px solid #ca8a04;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;fo ><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Jensen Huang: AI CEOs Have &#39;Ulterior Reasons&#39; in Doomsday Warnings</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Business Insider</td><td style="padding-left:10px;"><a href="https://www.businessinsider.com/nvidia-jensen-huang-ai-regulation-anthropic-amodei-openai-altman-trump-2026-9" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://oilprice.com/Energy/Energy-General/The-AI-Data-Center-Boom-Faces-a-New-Reality-Check.html" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The AI Data Center Boom Faces a New Reality Check</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">OilPrice</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://decrypt.co/379400/bitcoins-quantum-problem-three-ways-researchers-are-trying-to-fix-it" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Bitcoin&#39;s Quantum Problem: Three Ways Researchers Are Trying to Fix It</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Decrypt</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.pennlive.com/opinion/2026/09/ais-data-centers-are-rebuilding-careers-in-northeastern-pennsylvania-opinion.html" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">AI data centers are bringing jobs back to northeastern Pennsylvania</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Mechanicsburg Patriot News </span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#2e1604 0%,#5c330d 52%,#875010 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Energy &amp; Compute &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Power And Permits, Not Chips, Now Decide The Winners</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">2035</span>&amp;nbsp; the year China is on pace to overtake the US and France in nuclear power generation, backed by a new IAEA deal to share reactor technology.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">For years the story was about who could buy the most Nvidia chips, but the real squeeze is shifting to whoever can actually deliver electricity and win local approval to build. Over the next five to ten years the money flows to the boring, hard-to-copy stuff: power plants (increasingly nuclear), the utilities that control the grid connection, and the construction trades that pour the concrete.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The companies that announced giant data center plans without locked-in power and permits are the ones who get squeezed when a fraction of that pipeline gets built.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week utilities and regulators started imposing tougher data center rules while a year of hype produced only a fraction of approved projects, and towns from San Jose to Hobart fought over whether to welcome or ban them. Meanwhile China is on pace to pass the US and France in nuclear power by 2035.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Still the chip everyone wants, with Beijing possibly clearing Alibaba and ByteDance to buy its RTX Pro 5500, but chips mean nothing without power to run them.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon</strong> Its Hobart data center is already paying the town windfall economic impact money, showing the winners are those who lock in local goodwill and power early.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Alibaba &amp; ByteDance</strong> China may let them buy new Nvidia chips, keeping them in the race, though they carry the risk of Beijing changing its mind.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the union electricians and construction trades filling northeastern Pennsylvania with stable jobs. Whether the winning company is Amazon, a utility, or a nuclear developer, someone has to wire and pour every one of these buildings, and those crews get paid regardless.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Alibaba &amp; ByteDance:</strong> Beijing may approve their purchases of Nvidia&#39;s new RTX Pro 5500 chip, keeping China&#39;s biggest AI players supplied and Nvidia&#39;s revenue flowing.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon, Hobart:</strong> Its still-unfinished data center is already cutting economic impact payments to the town, buying the local acceptance that decides whether these projects get built.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands straight on the AI force: if power and permits cap how many data centers get built, the frontier labs racing to train ever-bigger models hit a physical wall no amount of funding can climb. Jensen Huang can dismiss doomsday warnings all he wants, but the grid quietly sets the pace.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more local fights, tougher utility rules, and quiet cancellations that reveal how much of the announced buildout was never real.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Nuclear power and grid access become the scarce prize, and whoever controls electricity, led increasingly by China, holds the leverage over compute.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If utilities quietly find the power and regulators wave projects through, the whole pipeline gets built and the bottleneck vanishes, making cheap chips and capital the winners again rather than scarce electricity and permits.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The crowd betting on scarce power may be early: chips get approved, hyperscalers have the cash to build their own generation, and today&#39;s permitting fights fade as towns like Hobart discover the tax money is too good to refuse. If most of the pipeline eventually gets built, the reality check was just a delay, not a ceiling.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The pre-IPO angle is thin this week, since the biggest names driving this story, Nvidia, Amazon, and Alibaba, already trade publicly. The private action sits with the smaller nuclear developers and regional power projects that will supply these data centers, none named clearly enough here to track yet.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>San Jose data center rules:</strong> Whether the city writes workable citywide regulations or drifts toward the pauses and bans its Bay Area neighbors chose tells you how hard local approval gets.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>China chip approvals:</strong> Formal sign-off letting Alibaba and ByteDance buy Nvidia&#39;s RTX Pro 5500 would show Beijing values keeping its firms competitive over pure self-reliance.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Utility data center tariffs:</strong> New rate rules that make data centers pay for their own grid upgrades would confirm power access, not chips, is now the gate.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ca8a04;color:#ffffff;font-size:14px;font-w
