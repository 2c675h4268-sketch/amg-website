the fiber that wire the data centers together, and the ones whose models get built into work people do every day, like schools, coding, and city permit offices. The squeeze lands on app makers who just rent a model they don&#39;t control, and on anyone who trained on stuff they didn&#39;t pay for.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Owning the pipes or the daily habit beats renting either.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week Virginia Beach, Virginia&#39;s largest school district, signed on with OpenAI, cities started using AI to clear housing permits with fresh federal funding, and Corning ramped fiber output with NVIDIA. Meanwhile Sony and Warner sued Anthropic over training on songs, showing the bill for how these models got built is coming due.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Locking in real customers like Virginia Beach schools while yanking its models from coding tool Cursor, showing who holds the leash.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Grabbed Cursor&#39;s business the moment OpenAI left, but now faces Sony and Warner suing over songs used to train Claude.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Corning &amp; NVIDIA</strong> Teaming up to crank out optical fiber for AI data centers, selling the plumbing every model maker needs regardless of who wins.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">OpenRouter, the marketplace where the mysterious Ox Alpha model quietly appeared this week, gets paid as the neutral counter where any model gets tried and distributed. It takes a cut no matter which lab&#39;s model developers end up choosing.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Corning &amp; NVIDIA:</strong> Corning is ramping fiber production with NVIDIA to feed AI data centers, a bet on the physical wiring behind every model.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Virginia Beach &amp; OpenAI:</strong> The state&#39;s largest school district bought ChatGPT access, the kind of institutional contract that turns AI from novelty into a habit.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">X, free API credits:</strong> X is giving away credits to push its Grok bot, paying to buy adoption because the tools people actually use is where the fight is.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week&#39;s fiber and chip buildout lands squarely on energy. Every new AI data center Corning wires and Intel&#39;s new architectures feed needs enormous power, so the scramble to build models keeps turning into a scramble for electricity.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more school, city, and enterprise contracts alongside messy court fights over training data and models being pulled from partner apps.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> The winners are the chip and fiber suppliers plus whoever owns the everyday habit, while pure app renters get squeezed out.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If courts side with Sony and Warner and force big payouts for training data, the cost of building competitive models jumps, and the model makers everyone is betting on look far less profitable than the pipe and chip suppliers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">All these deployments are cheap pilots and giveaways, not proof anyone pays enough to cover the enormous cost of building and running these models. If free credits and school licenses never turn into real profit, the whole thing looks like spending far ahead of any money coming back.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The interesting private names are the tools people build on top, like Cursor, whose business swung from OpenAI to Anthropic in a week. That fragility is the whole point: a private app maker that depends on a model it doesn&#39;t own can lose its supply overnight.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Sony and Warner v. Anthropic:</strong> An early ruling or settlement would set the price of training on copyrighted work and reshape who can afford to build models.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Cursor&#39;s model supply:</strong> Whether developers stick with Anthropic&#39;s higher Claude limits shows how much power model makers hold over the tools built on top of them.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>City permitting pilots:</strong> Results from AI-assisted housing approvals will show if governments become a steady buyer or just a headline.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full AI analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px h=1600&amp;fit=bounds" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#f5f3ff;color:#7c3aed;margin-bottom:8px;">Robotics</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Sanctuary AI Built A Robot Body. Now It&#39;s Also Selling A Robot Brain</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Forbes</td><td style="padding-left:10px;"><a href="https://www.forbes.com/sites/johnkoetsier/2026/08/29/sanctuary-ai-built-a-robot-body-now-its-also-selling-a-robot-brain/" style="font-size:12px;font-weight:600;color:#7c3aed;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://thenextweb.com/news/world-humanoid-robot-games-beijing-usain-bolt-record" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">A humanoid robot just beat Usain Bolt&#39;s 100m record, and roboticists are unimpressed for good reason</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">TNW</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.cnet.com/tech/computing/copy-of-the-robots-are-stumbling-on-their-way-to-the-revolution/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The Robots Are Stumbling on Their Way to the Revolution</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">CNET</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://decrypt.co/376265/robot-brains-chatgpt-moment-ace-robotics" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Robot Brains Could Have Their &#39;ChatGPT Moment&#39; by 2027, ACE Robotics Chairman Says</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Decrypt</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#170833 0%,#341563 52%,#552aa0 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Robotics &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">The Money Moves From Robot Bodies To Robot Brains</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">99.5 percent-plus</span>&amp;nbsp; Sanctuary AI&#39;s success rate on a complex wire-plugging task at an automotive supplier, the kind of dependable work that actually sells.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next five to ten years, the winners in humanoid robots won&#39;t be the crews building the flashiest metal bodies, they&#39;ll be the ones selling the software brain that lets any robot do real work reliably, like plugging wires or sorting parts without failing. Body-only builders get squeezed into low-margin hardware while the brain sellers charge for the part customers actually care about.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The company that comes out ahead licenses its intelligence to run on many machines, not just its own.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Sanctuary AI hit a 99.5%-plus success rate on a fiddly wire-plugging task at an automotive supplier and started selling that brain separately from its robot body. Meanwhile Beijing&#39;s robots set a 9.39-second 100m record and then fell down the stairs, showing that stunts are easy and dependable work is the hard, valuable part.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Sanctuary AI</strong> Proved high reliability on a real factory task and is now selling its robot brain on its own, the exact move the thesis rewards.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Boston Dynamics</strong> Its Spot quadrupeds landed a real government buyer in ICE, showing paying customers want proven task machines, not demo athletes.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Dreame</strong> Its LiDAR robomower shows the consumer end, but import limits on Chinese robotics may block it from the U.S. market entirely.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The quiet winner is whoever supplies the sensing hardware these robots need to perceive the world, like the LiDAR navigation that lets Dreame&#39;s mower skip satellites. Those parts sell into every serious robot regardless of which brand&#39;s brain or body wins.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ICE, up to $2M:</strong> Immigration enforcement is buying Boston Dynamics Spot robots, one of the clearest real-world paychecks for practical robotics this week.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Sanctuary AI:</strong> Splitting its AI brain from its hardware to sell software separately, a bet that intelligence, not the body, is what buyers pay for.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">PwC estimate:</strong> Projects the physical AI market reaching significant scale across operations and analytics, pointing money toward brains that perceive and act.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. ACE Robotics expects robot brains to hit a ChatGPT-style breakthrough by 2027, meaning the same model advances driving chatbots are now aimed at machines that move and grab things in the physical world.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more record-setting stunts and viral tumbles, plus a handful of real contracts like ICE&#39;s for narrow, proven tasks.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the bet holds, a few brain makers license intelligence across many robot bodies and collect the margins hardware builders can&#39;t.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the promised breakthrough in robot brains slips well past 2027 and machines stay unreliable at everyday chores, buyers keep treating humanoids as expensive novelties and the software-brain business never finds enough paying work.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The dependable demos are still narrow, a single wire-plugging task under controlled conditions, and the leap to robots that handle unpredictable homes and factories may take far longer and cost far more than optimists claim. Reliability, safety, and privacy problems keep stalling, so buyers could stay stuck with cheap single-purpose machines instead of paying for general brains.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Sanctuary AI is the private name to track: it just showed factory-grade reliability and is selling its brain on its own, testing whether investors will pay for robot intelligence apart from metal. Readers can&#39;t buy it yet, but its licensing deals will preview where this whole market is heading.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Sanctuary AI brain licensing deals:</strong> New customers running its brain on other bodies would prove the software-first business actually sells.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>ICE Spot rollout:</strong> How the up-to-$2 million Boston Dynamics deployment performs will show whether task robots earn repeat government orders.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Progress toward the 2027 brain breakthrough:</strong> Any model that reliably handles messy home or factory tasks would confirm the brain is where value lands.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0; ;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://markets.businessinsider.com/news/stocks/l3harris-contributed-to-nasa-s-nancy-grace-romance-space-telescope-1036505170" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">L3Harris contributed to NASA&#39;s Nancy Grace Romance Space Telescope</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Markets Insider</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://markets.businessinsider.com/news/stocks/cathie-wood-buys-27-5m-of-spacex-stock-sells-27-2m-of-palantir-shares-1036484636" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Cathie Wood Buys $27.5M of SpaceX Stock, Sells $27.2M of Palantir Shares</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Markets Insider</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://markets.businessinsider.com/news/stocks/spacex-spcx-starlink-mobile-faces-a-stubborn-physics-problem-bernstein-warns-1036484633" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">SpaceX (SPCX) Starlink Mobile Faces a &#39;Stubborn Physics Problem,&#39; Bernstein Warns</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Markets Insider</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Space Is Real Business Now, But Mind The Physics</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$27.5 million</span>&amp;nbsp; what ARK spent on SpaceX stock on August 21, funded partly by selling $27.2 million of Palantir.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Space is turning from a science story into a real business, and the money is splitting into two piles. The winners are the ones who own the hard infrastructure, the rockets and satellite networks that everyone else has to rent, plus the specialist suppliers who build the optics and instruments no one can fabricate cheaply.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The losers will be the companies selling a dream that the laws of physics won&#39;t back up, like satellites fully replacing your phone tower. Boring, proven capability beats hype.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Cathie Wood&#39;s ARK bought $27.5 million of SpaceX stock on August 21 while dumping $27.2 million of Palantir, a bet on who owns the pipes. Same week, Bernstein warned that Starlink mobile hits a "stubborn physics problem," and China postponed its Chang&#39;e-7 moon mission, proving execution is still brutally hard.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX (SPCX)</strong> The public heavyweight everyone wants to own, but Bernstein&#39;s physics warning tests whether Starlink can really replace ground mobile networks.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">L3Harris Technologies</strong> Built the optics for NASA&#39;s newly launched Roman Space Telescope, the quiet supplier that gets paid on missions regardless of who flies them.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ARK Invest</strong> Cathie Wood is rotating institutional money into SpaceX and out of Palantir, shaping how public investors value space infrastructure.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the instrument makers like L3Harris, who supplied the optics for the Roman telescope. They get paid whether NASA, China, or a private launcher wins, because everyone needs the precision hardware they can&#39;t build in-house, and their revenue doesn&#39;t hinge on any single mission succeeding.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ARK Invest, $27.5M:</strong> Bought SpaceX stock, a vote that owning launch and satellite infrastructure beats owning the analytics software it sold.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ARK Invest, $27.2M:</strong> Sold Palantir shares to fund the SpaceX buy, showing where big managers now see the better growth.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">NASA NIAC, 18 awards:</strong> Funded 18 early-stage concepts including 10,000 femtosats to Saturn, seeding the far-out ideas suppliers may build a decade out.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into energy. Bernstein&#39;s physics warning on Starlink mobile is really about power and sign limits in orbit, and packing more capability into satellites means the next fight is cramming more energy and efficient power systems into small spacecraft.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more public money rotating into SpaceX and hard scrutiny of whether Starlink&#39;s mobile claims survive real-world testing.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> A handful of infrastructure owners and specialist suppliers dominate space, while hype-driven consumer promises get quietly trimmed to what physics allows.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Bernstein is right that orbital physics caps Starlink&#39;s mobile ambitions, the story that satellites replace cell towers collapses, and the sky-high value investors are paying for that growth looks badly overstated.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The whole space trade leans on SpaceX, and one analyst just flagged that its most exciting consumer promise runs into physics it can&#39;t beat. Missions still slip, as China&#39;s postponed moon shot shows, so the timelines investors are paying for may arrive years later and cost far more than promised.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The pre-IPO angle is thin this week because the marquee name, SpaceX, already trades publicly under SPCX. The private action sits earlier: NASA&#39;s 18 NIAC awards fund the small research teams and startups chasing ideas like femtosats to Saturn, the seedbed where tomorrow&#39;s private space companies quietly start.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Chang&#39;e-7 rescheduling:</strong> When China names a new launch window, it shows whether the moon-water race is delayed months or slipping into a new era.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Starlink mobile field results:</strong> Real-world speeds and coverage numbers will confirm or kill the direct-to-phone promise Bernstein is questioning.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Further ARK space moves:</strong> More buying or selling of SpaceX indicates how fast public money is committing to space infrastructure versus software names.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ea580c;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Space analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #059669;"><tr><td style="border-left:3px solid #059669;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#059669;">Longevity</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Longevity</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspaci <tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://techcrunch.com/wp-content/uploads/2026/08/Vijay-Pande.png?resize=1200,800" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:8px;">Longevity</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">"We&#39;re not doing 30 bets a year": Vijay Pande on betting small after running $4 billion at a16z</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">TechCrunch</td><td style="padding-left:10px;"><a href="https://techcrunch.com/2026/08/29/were-not-doing-30-bets-a-year-vijay-pande-on-betting-small-after-running-4-billion-at-a16z/" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://imageio.forbes.com/specials-images/imageserve/6a8ae9d9d47e6c37ccc965a2/0x0.jpg?format=jpg&amp;height=900&amp;width=1600&amp;fit=bounds" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:8px;">Longevity</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Claude Designed Proteins That Worked Against 14 Of 15 Disease Targets</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Forbes</td><td style="padding-left:10px;"><a href="https://www.forbes.com/sites/jonmarkman/2026/08/23/claude-designed-proteins-that-worked-against-14-of-15-disease-targets/" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.inquirer.com/health/dispatch-bio-clinical-trial-penn-tumor-solid-cancer-treatment-20260829.html" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Dispatch Bio launches its first clinical trial to develop a universal treatment for solid cancers</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">The Philadelphia Inquirer</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.newsweek.com/keto-diet-beats-mediterranean-diet-in-clinical-trial-study-finds-12380896" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Keto Diet Beats Mediterranean Diet in Clinical Trial, Study Finds</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Newsweek</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.sfgate.com/california/article/biotech-company-relocates-texas-22406522.php" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">California loses another multibillion-dollar company to Texas</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">SFGATE</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#042c20 0%,#065f46 52%,#08795b 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Longevity &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">AI Turns Drug Discovery Into Engineering, Specialists Cash In</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">14 of 15</span>&amp;nbsp; the disease targets Claude designed working protein binders for on its own, over sessions lasting a day or two.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The old way of finding drugs, mostly trial, error, and luck, is giving way to something that looks more like engineering, where AI designs the molecule and humans test it. The winners here are the labs and funds that treat biology like software: build with AI, aim at rare or hard diseases where a single approval prints real money, and stay small and focused.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The companies that get squeezed are the sprawling old-line drugmakers whose main edge was armies of chemists and slow, expensive guesswork.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Anthropic handed Claude sixteen protein targets and a cloud account, walked away, and the AI designed working binders for 14 of 15 in a day or two. That same week Vijay Pande left his roughly $4 billion a16z biotech practice to run a tighter AI-native fund, betting biology is now an engineering problem.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Its Claude model autonomously designed protein binders that hit 14 of 15 disease targets, showing AI can do the hardest early design work itself.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">BioCryst</strong> A newly profitable rare disease biotech now shopping for more rare drugs, the model for how small focused players win in this market.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Roivant &amp; Priovant</strong> Just landed FDA approval for Lisraya in a rare autoimmune disease, proving the targeted, buy-and-build approach still turns into real revenue.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The quiet winner is whoever sells the compute and lab automation these AI designers run on. Anthropic ran Claude&#39;s protein work through a cloud account, so the companies renting out that computing power and the wet-lab services that validate the designs get paid whether or not any single drug works.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Dispatch Bio, $216M:</strong> The Penn spinout co-founded by CAR-T pioneer Carl June raised it from private investors to chase a universal treatment for solid tumors.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">VZVC (Vijay Pande):</strong> After running roughly $4 billion at a16z, he launched a smaller, focused AI-native biotech fund built on the bet that biology is now engineering.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">BioCryst:</strong> Profitable and actively hunting rare disease drugs to buy, a sign smaller biotechs are becoming the acquirers, not just the acquired.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. A frontier model doing real scientific work without human hand-holding shows that the same systems people use to write emails are now doing original biology, which makes drug discovery one of AI&#39;s most valuable practical jobs.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more flashy AI-design headlines and busy rare disease dealmaking, while investors stay choosy and reward companies with actual approvals.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the engineering approach holds, a handful of AI-first, disease-focused biotechs will out-invent the old giants and control the most valuable pipelines.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If AI-designed proteins keep failing in actual patients, the way most promising lab results do, then this week&#39;s 14-of-15 headline stays a demo. Clinical trials remain brutally expensive and slow, and that is where the engineering dream still meets biology&#39;s stubbornness.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">AI designing a protein that binds in a dish is a long way from a pill that helps a sick person, and history is full of dazzling early results that die in trials. The money and time still pile up in human testing, which no algorithm has made cheaper yet.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Dispatch Bio is the private name to track, freshly funded with $216 million and dosing its first patient in a universal solid-cancer trial. Anthropic, whose Claude did the protein work, is also still private, so the two companies pushing this bet hardest are ones ordinary investors cannot buy yet.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Dispatch Bio&#39;s first trial readout:</strong> Its universal solid-tumor CAR-T attempt is dosing patients now, and early safety data would show whether the science lives up to the $216 million raise.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>BioCryst&#39;s next acquisition:</strong> A concrete deal would confirm that profitable small biotechs, not the giants, are the ones rolling up rare disease drugs.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>AI-designed drug entering the clinic:</strong> The first program born from an AI protein designer filing for human trials would move Claude&#39;s feat from lab curiosity to real pipeline.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#059669;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px ing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://www.europesays.com/wp-content/uploads/2026/08/https3A2F2Fmedia.zenfs_.com2Fen2Fmotleyfool.com2Fc9d79454599aa4743b9e5845b4cdfd28.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Nvidia Just Delivered Bad News for AMD and Intel</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">EUROPE SAYS</td><td style="padding-left:10px;"><a href="https://www.europesays.com/3223725/" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.foxnews.com/politics/massive-ai-boom-puts-one-americas-oldest-manufacturers-path-double-size-ceo-says" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Corning and NVIDIA partner to expand optical fiber for AI data centers</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Fox News</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.europesays.com/3223640/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Greece power grid connection gets US backing</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.washingtonexaminer.com/policy/technology/4697747/greg-abbott-texas-data-center-developers/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Greg Abbott says data center developers &#39;dug their own grave&#39;</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Washington Examiner</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#2e1604 0%,#5c330d 52%,#875010 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Energy &amp; Compute &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Power, Not Chips, Becomes the AI Bottleneck</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">11 square miles</span>&amp;nbsp; the land PPL&#39;s joint venture just secured in Pennsylvania to build data center power plants.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The scarce thing in AI isn&#39;t chips anymore, it&#39;s electricity, and the money is shifting to whoever can actually deliver power. Companies that own generation, land for new plants, and grid connections get to name their terms, while data center builders who assumed they could plug in anywhere are running into angry communities and state officials saying no.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners over the next decade are the utilities, gas-plant developers, and grid-hardware makers; the losers are anyone who treated cheap, easy power as a given.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week PPL&#39;s joint venture locked up more than 11 square miles in Pennsylvania for data center power plants, and gas-fired capacity tied to data centers is on track to nearly double in the first half of 2026. Meanwhile Texas Governor Abbott dug in on a data center moratorium, proving power access is now political, not automatic.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">PPL Corp.</strong> Locked up over 11 square miles for data center power plants, betting that owning generation and land beats owning servers.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Blowout quarter and raised guidance show chip demand is fine; the constraint has moved to feeding those chips electricity.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Corning</strong> Expanding optical fiber production with Nvidia to wire AI data centers, a supplier that gets paid regardless of which builder wins.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Corning is the quiet winner here. Every AI data center needs miles of high-speed glass fiber to link its servers, so Corning gets paid whether the power comes from gas, private equity utilities, or Tesla&#39;s storage, and no matter which cloud giant builds the site.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">PPL Corp.:</strong> Its joint venture grabbed more than 11 square miles for power plants, a bet that generation is the choke point worth owning.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Private equity:</strong> Investors are circling US utilities as AI strains the grid, treating power assets as the surest way to cash in.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Corning &amp; Nvidia:</strong> Corning is scaling fiber output under a Nvidia partnership, backing the picks-and-shovels side of the data center boom.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely on energy. The AI compute rush is now driving a real-world US natural gas buildout and new grid projects like the US-backed Israel-to-Greece interconnector, which means chip demand is reshaping what gets built in the physical power business.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more local fights, moratoriums, and midterm campaigns over electricity bills to slow where data centers can actually get built.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Whoever owns generation and grid connections becomes the gatekeeper of AI, and power, not compute, sets the ceiling on growth.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If communities and states keep winning, spreading Abbott-style moratoriums and turning electricity bills into a midterm weapon, the buildout stalls and the power owners never get the customers or the returns they&#39;re counting on.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The gas and grid buildout takes years and billions, and if AI demand cools or efficiency improves faster than expected, a lot of that power capacity gets built for customers who never fully show up. Public anger over rising electricity bills could also force rules that make these projects far less profitable than the current excitement assumes.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The clearest private-market angle this week is the private equity money circling US utilities as AI strains the grid. These buyouts happen in private hands before any public exit, so watch which firms acquire power assets, because they&#39;re betting owning electricity beats owning the flashier chip and cloud names.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Texas moratorium outcome:</strong> Whether Abbott&#39;s stance holds or bends shows if data center power gets built where the demand is or gets pushed elsewhere.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>2026 gas capacity additions:</strong> If planned gas-fired capacity tied to data centers actually doubles, it confirms power, not chips, is where the spending goes.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Private equity utility deals:</strong> New acquisitions of utility assets would prove smart money sees owning the grid as the surest way to profit from AI.</td></tr></table></td></tr></
