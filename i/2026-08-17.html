liver results people can point to.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The companies making chatbots that also write your slides and run your desktop stand to grab a lot of office work, while the model makers who overpromise and can&#39;t earn public trust get squeezed. Boring plumbing like cost management and provenance quietly makes the money.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week a Fortune-cited study found 62% of companies hit surprise AI bills, with 40% escalating to the board, which is why cost-routing tools are suddenly hot. Meanwhile Anthropic&#39;s Dario Amodei called the backlash "a crisis of trust" and said AI must deliver real results, as his company embedded EU-compliant watermarks into Claude output.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Buying NextSlide and shipping a desktop-logging Computer History feature, it&#39;s building an office suite to own everyday work, carrying the trust and privacy risk.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Betting on provenance watermarks and Amodei&#39;s public trust message, positioning Claude as the accountable, enterprise-safe choice for cautious boardrooms.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceXAI (Grok)</strong> Its Grok Imagine 2.0 editing tools now rank second on the Arena benchmark behind OpenAI, chasing the same creative and office work.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If cost overruns stop mattering and buyers just pick whoever has the smartest model regardless of provenance or privacy, the trust-and-plumbing thesis falls apart and raw capability wins outright.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>OpenAI office-suite rollout:</strong> How fast NextSlide&#39;s presentation tools land inside ChatGPT shows whether OpenAI can actually take over routine knowledge work.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding llpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://media.thenextweb.com/2026/05/lg-electronics-stock-surge-google-android-automotive.jpg" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#f5f3ff;color:#7c3aed;margin-bottom:10px;">Robotics</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">LG&#39;s humanoid robot arrives in 2027, running Nvidia&#39;s Isaac GR00T</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">LG will unveil a bipedal humanoid robot in Q1 2027, built on Nvidia&#39;s Jetson Thor processor and Isaac GR00T foundation model. The partnership was announced at Nvidia&#39;s Santa Clara headquarters on August 13, with LG also planning an 80MW AI factory in South Korea.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">TNW</td><td style="padding-left:16px;"><a href="https://thenextweb.com/news/lg-nvidia-humanoid-robot-2027-isaac-groot" style="font-size:14px;font-weight:600;color:#7c3aed;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://static.foxnews.com/foxnews.com/content/uploads/2026/08/Foundation-Photo-1.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#f5f3ff;color:#7c3aed;margin-bottom:8px;">Robotics</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Humanoid robots pitched to DHS for southern border surveillance</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Fox News</td><td style="padding-left:10px;"><a href="https://www.foxnews.com/politics/humanoid-robots-patrol-southern-border-ceo-pitches-futuristic-technology-moves-closer-reality" style="font-size:12px;font-weight:600;color:#7c3aed;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://www.baltimoresun.com/wp-content/uploads/2026/08/BIZ-CPT-RETAILERS-ROBOTS-FILEPIC-MCT.jpg?w=1600&amp;h=1013" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#f5f3ff;color:#7c3aed;margin-bottom:8px;">Robotics</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Walmart and Target are buying robots at record numbers. Here&#39;s why your job is safe.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Baltimore Sun</td><td style="padding-left:10px;"><a href="https://www.baltimoresun.com/2026/08/14/walmart-and-sams-club-are-buying-robots-at-record-numbers-heres-why-your-job-is-safe/" style="font-size:12px;font-weight:600;color:#7c3aed;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#170833 0%,#341563 52%,#552aa0 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Robotics &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">The Boring Robots Make Money While Humanoids Wait</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Over the next five to ten years, the reliable money in robotics comes from two places: the companies selling the brains and chips that everyone else builds on, and the companies whose robots already do dull, repeatable jobs like scrubbing floors and counting shelves. The flashy walking humanoids will grab headlines but stay expensive science projects for years, squeezing the startups that bet everything on them before customers will pay.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Whoever supplies the shared software and processors wins either way, because rivals still buy from them even when they compete.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">LG&#39;s bipedal humanoid won&#39;t even be shown until early 2027, and it runs on Nvidia&#39;s Jetson Thor chip and Isaac GR00T model, so Nvidia gets paid long before LG ships anything. Meanwhile Brain Corp already has over 50,000 cleaning and inventory robots working today and posted 68% sales growth, proving the paying customers want boring, not bipedal.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Sells the chips and foundation model behind LG&#39;s humanoid and others, so it earns money whether or not any single robot succeeds.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">LG</strong> Betting on a 2027 humanoid plus an 80MW AI factory, carrying the risk that walking robots stay costly demos, not products.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Brain Corp</strong> Already has 50,000-plus robots cleaning and counting stock for Walmart and Target, showing the practical, unglamorous work is where revenue lives now.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If a humanoid maker actually ships a robot that does useful work at a price retailers or agencies will pay well before 2027, the split between boring earners and distant dreamers collapses, and the humanoid bets look smart instead of early.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Foundation&#39;s DHS decision:</strong> Whether Homeland Security moves past demos to a real contract would show humanoids can earn money now, not just later.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Brain Corp&#39;s next sales update:</strong> A repeat of 68% growth confirms retailers keep buying practical robots faster than anyone expected.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="widt -thanks-nasa-for-letting-him-fly-orion-by-hand-im-still-blown-away-by-that-trust" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Space Turns Into Paid Infrastructure The Few Big Owners Win</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Space is quietly turning into paid infrastructure, with three buyers writing the checks: the military that wants eyes and targeting from orbit, phone makers that want your handset to work anywhere, and AI companies that want computers running in space. The money piles up with the few outfits that own the rockets and the big satellite fleets, plus the chipmakers who sell them the brains, while small launch startups without a government customer get starved.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners look like utilities with a captive audience, not scrappy pioneers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week the Space Force handed SpaceX a $4.16 billion sensing and targeting contract, Nvidia signed on to design the compute payload for SpaceX&#39;s Starmin satellites, and Apple&#39;s iPhone 18 Pro is due next month with satellite 5G. Each of those is a paying customer, not a promise.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Sitting at the center with the Space Force money, the Nvidia deal, and a volatile new public stock that swung from below $105 back above its $135 IPO price.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Extending its AI chip business into orbit through the exclusive Starmin partnership, which analysts frame as the start of a trillion-dollar growth cycle.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Apple</strong> Putting satellite 5G into the iPhone 18 Pro next month, quietly making space connectivity a standard feature in everyday consumer phones.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If SpaceX&#39;s stock rally proves unsustainable as one top investor warns, or the Nvidia orbital compute plan hits power and cooling limits in space, the infrastructure story deflates into hype and the government becomes the only real buyer.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>SpaceX public-market performance:</strong> Whether the 29% August surge holds or reverses will show if investors treat space as a real business or a momentum trade.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Space Force portfolio follow-on awards:</strong> More sensing and targeting contracts after the $4.16 billion SpaceX deal would confirm the military is the anchor customer funding this buildout.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></t ,255,255,0.82);">This week gave us the first FDA-approved gene therapy for hearing loss, Bristol Myers Squibb&#39;s accelerated nod for Zenbexus, and Outlook&#39;s LYTENAVA clearance, showing approval is where value shows up. But Outlook booked just $9,000 in quarterly revenue, and a judge blocked the Pentagon from blacklisting WuXi AppTec, proving both halves of the bet remain live.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">WuXi AppTec</strong> A Chinese contract manufacturer that just won a court block against a Pentagon blacklist, it carries the geopolitical risk everyone is watching.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Bristol Myers Squibb</strong> Its accelerated approval for the myeloma drug Zenbexus shows the big players still turn FDA wins into real commercial products.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Eton Pharmaceuticals</strong> A specialty drugmaker that beat sales forecasts and raised guidance, it&#39;s proof that approved, focused products can drive genuine momentum.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If FDA approvals keep failing to become
