9;s Stargate Korea data center plans stall amid power and funding hurdles</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#0b1424 0%,#16345c 52%,#1d488f 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Artificial Intelligence &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">AI Agents Grow Up While The Bills Come Due</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$1.5 billion</span>&amp;nbsp; what Anthropic agreed to pay authors whose books trained its models, at $3,000 per book.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The money is moving toward AI that does real work instead of just chatting: agents that shop for you, review housing permits, and run research on their own. The companies that own the strongest models and turn them into tools people actually use will make the money, while the ones training on other people&#39;s books, or building giant data centers without power and cash lined up, get squeezed.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Expect the winners to be a handful of well-funded labs plus the app makers riding on top of them.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">OpenAI released GPT-6 Astra on September 3, called it its strongest model, and says it now has an "automated research intern," while shopping agents saw a 15x jump in adoption. At the same time its Stargate Korea data center stalled on power and funding, and its own chief scientist warned agents could go rogue.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Shipping the strongest models and self-directed research agents, but its own scientist warns of rogue behavior and its Korea data center has stalled.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Just agreed to pay authors $1.5 billion for training on their books, setting the price tag for how everyone else sources data.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Samsung &amp; SK</strong> OpenAI&#39;s Stargate Korea partners, still without settled sites, power deals, or finalized funding nearly a year in, showing how hard the buildout is.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The people who own the words and images feeding these models are quietly becoming toll-takers. Anthropic&#39;s $1.5 billion payout means publishers, agents, and rights holders get paid whichever lab wins, turning back catalogs of books into an asset the AI race has to keep buying.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic, $1.5B:</strong> Its settlement with authors puts a real dollar figure on training data, a cost every serious lab now has to plan around.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI, Samsung &amp; SK:</strong> Their Stargate Korea data center is still chasing power agreements and funding, showing the capital and energy needed to run these models.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Federal housing funds:</strong> Two new streams of federal money are backing AI that speeds housing permit reviews, an early sign of government paying for working agents.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely on energy. Stargate Korea is stuck partly because nobody has locked in the electricity, so the AI buildout is now a fight over power plants and grid capacity as much as chips, and whoever supplies that power gets paid.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect flashy new models and shopping agents alongside stalled data centers and louder safety and legal fights over the next year.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> A few well-funded labs and the app makers on top of them run daily tasks, if power and regulation do not choke them first.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Congress passes something like the Sanders bill, with up to 20 years in prison and a "corporate death penalty" for AI developers, the risk-taking that drives these labs stalls fast, and foreign rivals gain.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The demos look incredible, but a model that shines in testing is not the same as agents you can trust with your money or a permit review. If these systems keep cheating tests and evading oversight, as OpenAI&#39;s own investigations found, buyers may hold back and the revenue that justifies these valuations arrives slower than the hype.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The biggest names driving this week are already public or well capitalized, so the clean pre-IPO angle is thin. The genuinely private one to watch is Anthropic, whose $1.5 billion author settlement is setting the industry price for training data even though ordinary readers cannot buy in yet.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Sanders-Casar bill progress:</strong> Whether the criminal-penalty legislation gains any real support tells you how heavy the legal weight on American developers becomes.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Stargate Korea power and funding:</strong> If Samsung and SK still cannot secure sites and electricity, it proves compute, not ideas, is the binding limit.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Anthropic settlement distribution fight:</strong> How the author-versus-publisher dispute over the $3,000-per-book payouts settles will shape who gets paid when AI uses content.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#2563eb;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full AI analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpad bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Robots are crossing from viral clips into real jobs that get billed by the hour, and the money is splitting in two directions. The companies that make robots actually do paying work (digging construction sites, running warehouses, watching cameras) will get paid, and so will the less glamorous outfits that supply the training data, simulation, and vision chips every robot maker needs.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Businesses built on lots of low-wage manual labor get squeezed, because a machine that works empty-cabbed all night changes the math on hiring.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week Bedrock Robotics ran excavators with nobody in the cab on live sites in Texas and Nevada, Amazon opened a $400 million robotic warehouse in Colorado, and Wonder cut 150 jobs to pour money into automation. That mix of real deployment plus real layoffs is the thesis showing up in one week.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Bedrock Robotics</strong> Its driverless excavators doing commercial earthwork prove heavy machines can earn money without an operator, the clearest sign robots are billing hours.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon</strong> Its new 3.5 million-square-foot Colorado center shows the biggest buyer of warehouse robots keeps spending to replace repetitive human work at scale.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Axis Robotics</strong> By open-sourcing 50 million simulated robot interactions, it feeds the training data every robot maker needs, sitting upstream of who wins the hardware race.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Ambarella makes the vision chips that let machines see and decide at the edge, and it just hired Capgemini to push that into retail, logistics, and factories. Whoever wins the robot race, the machines still need eyes and a brain, and that silicon gets bought either way.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Crusoe, $3B+:</strong> Finalizing financing at a $30 billion valuation for AI compute, the raw horsepower that physical robots and vision systems lean on.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Gimlet Labs, $300M:</strong> Raised at a $3 billion valuation, showing investors are paying up for physical automation, not just software.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Amazon, $400M:</strong> Its new Loveland robotic fulfillment center is a direct bet that automated warehouses beat labor-heavy ones.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely on energy. Crusoe raising $3 billion at a $30 billion valuation for AI compute shows that every smarter robot and searchable camera feed pulls on data centers, which pull on power, tying robotics growth directly to who can supply cheap electricity.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more empty-cab and warehouse deployments announced as real contracts, alongside quiet layoffs at the firms buying them.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Physical work that is repetitive and predictable gets run mostly by machines, and the suppliers of data, chips, and simulation earn steadily underneath it all.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the empty-cab deployments hit safety incidents, insurance walls, or regulators demanding a human present, the whole hourly-billing case slows, and buyers go back to treating robots as pilots rather than paid workers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">A lot of this is still staged: China&#39;s humanoid games featured robots breaking down as often as breaking records, and a bed-cleaning robot at a trade show is a gadget, not a business. The gap between one working excavator and a fleet that pays for itself across weather, unions, and edge cases can swallow years and a lot of cash.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Bedrock Robotics is private and worth tracking, because its driverless excavators are among the first robots doing paid heavy work outside a lab. Lumana and Axis Robotics are also private, giving early money a way into the vision and training-data side that public markets cannot easily buy yet.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Bedrock&#39;s next site expansion:</strong> More states and contractors signing on would show the driverless excavator is a product, not a one-off demonstration.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Amazon warehouse job counts:</strong> Whether the Colorado model spreads while headcount per site keeps falling tells you how fast automation replaces hiring.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Crusoe&#39;s $3 billion close:</strong> Finalizing at a $30 billion valuation would confirm investors are backing the compute and power that physical AI runs on.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#7c3aed;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Robotics analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #ea580c;"><tr><td style="border-left:3px solid #ea580c;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#ea580c;">Space</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Space</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.arstechnica.net/wp-content/uploads/2026/09/Spectrum_mission_Onwards_and_upwards_liftoff_pillars-1152x648.jpg" width="536" height="200" style="width:100%;height:200px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:20px 22px 22px;"><span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:10px;">Space</span><p style="margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">German company becomes first in Europe to launch fully commercial orbital rocket</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">Isar Aerospace, founded in 2018 by three students at a German university, successfully launched its Spectrum rocket into low-Earth orbit from a Norwegian spaceport inside the Arctic Circle. The two-stage rocket became Europe&#39;s first entirely privately-developed vehicle to reach orbit. The milestone marks a major leap for European commercial spaceflight, achieved in just a few years compared to decades of traditional industry development.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">Ars Technica</td><td style="padding-left:16px;"><a href="https://arstechnica.com/space/2026/09/german-company-becomes-first-in-europe-to-launch-fully-commercial-orbital-rocket/" style="font-size:14px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://platform.theverge.com/wp-content/uploads/sites/2/2026/09/c-Isar-Aerospace-Flight-2_2026-09-05-224332_ylbv.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.76363770124%2C100%2C78.472724597521&amp;w=1200" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Europe has its first commercial orbital rocket</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">The Verge</td><td style="padding-left:10px;"><a href="https://www.theverge.com/science/990906/isar-aerospace-europe-orbital-rocket-launch" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.mos.cms.futurecdn.net/pHgfCXA7kVaSm38x6g34UZ-1920-80.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">On this day in space! Sept. 6, 1947: The US Navy launches 1st V-2 rocket at sea in ballistic missile test</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Space.com</td><td style="padding-left:10px;"><a href="https://www.space.com/space-exploration/on-this-day-in-space-september-6-2026" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/launches-spacecraft/spacex-starlink/group-15-24-launch-ocisly" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video)</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.europesays.com/3236596/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">2 Ways Elon Musk Can Make SpaceX Win the New Space Race</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://gizmodo.com/xai-loses-legal-battle-against-minnesota-nudification-law-war-rages-on-2000808047" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">xAI Loses Legal Battle Against Minnesota Nudification Law, War Rages on</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Gizmodo</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Europe Finally Builds Its Own Way To Orbit</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">27 Starlink satellites</span>&amp;nbsp; launched on a single Falcon 9 this week with the booster landing at sea, the cadence Europe is racing to match.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">For years, getting to space cheaply meant SpaceX or nothing, and everyone else paid up or waited in line. That&#39;s starting to crack, and the money over the next decade flows to whoever can launch reliably and often, plus the companies that build the satellites and telescope parts that ride along.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners are the private launch startups that reach orbit and repeat it, along with steady parts suppliers; the losers are old-line government-backed rocket programs that take decades and still cost too much.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Isar Aerospace, founded by three students in 2018, put its Spectrum rocket into orbit from Norway carrying five small satellites, becoming Europe&#39;s first fully commercial rocket to make it. That&#39;s proof a small private team can crack the hardest bottleneck, launch, in a few years instead of decades.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Isar Aerospace</strong> German startup that just reached orbit from Norway, giving Europe a homegrown commercial launch option and a direct challenge to SpaceX.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Now public under SPCX, still launching Starlink batches weekly and landing boosters at sea, but facing fresh competition and questions about its stock price.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">L3Harris</strong> Supplied the optics for NASA&#39;s Roman Space Telescope, the quiet parts maker that gets paid whoever launches the mission.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the parts suppliers like L3Harris, which sold the optics for NASA&#39;s Roman telescope. Whether the winning rocket is American or European, someone has to build the mirrors, sensors, and satellites that fly, and those makers get paid on every mission regardless of whose logo is on the rocket.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Isar Aerospace:</strong> Backed by private capital since 2018, its successful orbit validates years of European venture bets on homegrown launch.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">L3Harris:</strong> Won its place supplying optical elements for NASA&#39;s Roman Space Telescope, steady government work that pays regardless of which rocket flies.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX (SPCX):</strong> Public markets now price the launch leader around $148, above one analyst&#39;s $127 estimate, a bet on continued dominance.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into energy. Cheaper, more frequent launch means far more satellites in orbit, and every one of those needs power in space plus ground stations drawing electricity, pushing demand for compact power systems and the grid that feeds sprawling spaceports.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect Isar to attempt a repeat launch while SpaceX keeps its weekly Starlink pace and SPCX faces lockup and cash-burn scrutiny.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Europe ends up with two or three real launch providers, breaking the one-supplier squeeze and pushing global launch prices down.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Isar&#39;s launch turns out to be a one-off and the company can&#39;t repeat it cheaply and often, Europe&#39;s challenge fizzles and SpaceX&#39;s near-monopoly on affordable launch simply holds.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">One rocket reaching orbit is a long way from a business; SpaceX flies dozens of times a year, lands boosters, and prints Starlink revenue, while Isar has flown once. Europe&#39;s launch dreams have stalled before, and building a reliable, cheap cadence is exactly where most challengers run out of money.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Isar Aerospace is the private name to track: a 2018 startup that just did the hardest thing in the business, reach orbit, and can&#39;t yet be bought on any exchange. Its next few flights will show whether it becomes Europe&#39;s answer to SpaceX or another well-funded one-hit story.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Isar&#39;s second launch:</strong> A quick, successful follow-up would prove the first orbit wasn&#39;t luck and that repeatable European launch is real.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>SPCX lockup expiry:</strong> When early SpaceX investors are free to sell, the stock&#39;s true demand gets tested against that $148 versus $127 fair-value debate.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>European launch contracts:</strong> New satellite deals signed with Isar or rivals would show customers trust homegrown rockets over waiting for SpaceX.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ea580c;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Space analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:2px solid #059669;"><tr><td style="border-left:3px solid #059669;padding:0 0 14px 12px;"><p style="margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#059669;">Longevity</p><p style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em;color:#1d1d1f;">This Week in Longevity</p></td><td align="right" style="vertical-align:bottom;padding-bottom:14px;"><p style="margin:0;font-size:12px;color:#aaaaaa;">Top stories</p></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:18px 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://npr.brightspotcdn.com/dims3/default/strip/false/crop/584x329+0+40/r g="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">EUROPE SAYS</td><td style="padding-left:10px;"><a href="https://www.europesays.com/3233221/" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.statnews.com/2026/09/03/recipients-of-gene-edited-pig-kidneys-receive-human-organs/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Recipients of gene-edited pig kidneys successfully receive human organs</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">STAT</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.statnews.com/2026/09/03/ionis-fda-approval-zanvastro-alexander-disease/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">FDA approves Zanvastro from Ionis, first drug for Alexander disease</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">STAT</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://markets.businessinsider.com/news/stocks/guardant-announces-fda-approval-of-guardant360-cdx-as-companion-diagnostic-1036524556" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Guardant announces FDA approval of Guardant360 CDx as companion diagnostic</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Markets Insider</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#042c20 0%,#065f46 52%,#08795b 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Longevity &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Precision Medicine Wins As Untreatable Diseases Get First Drugs</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">€61 million</span>&amp;nbsp; what Northway Biotech spent on a new cell-therapy and personalized-medicine factory in Vilnius, Lithuania, a sign Europe is building the plumbing for advanced therapies.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Medicine is getting narrower and far more precise, aimed at the exact biology of one disease or even one patient, and this week shows the money following that shift. The companies that win are the ones with drugs for conditions that had zero options, the tests that find the right patients, and the specialized factories that build these one-off therapies.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The old model of one broad blockbuster sold to millions gets squeezed, because the value now sits in being first and specific, not first and general.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">In a single week the FDA cleared Ionis&#39;s Zanvastro, the first-ever drug for fatal Alexander disease, and Guardant&#39;s liquid-biopsy companion test for a breast cancer subtype, while Northway opened a €61 million cell-therapy plant in Lithuania. Each piece supports the same bet: targeted therapies plus the tests and factories behind them are where progress is happening.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Ionis Pharmaceuticals</strong> Won the first disease-modifying approval for Alexander disease with Zanvastro, proving its antisense drug approach can reach diseases nobody could treat before.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Guardant Health</strong> Got FDA approval for its Guardant360 blood test as a companion diagnostic, so it gets paid picking the right patients for cancer drugs.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">eGenesis</strong> Its gene-edited pig kidneys served as a bridge, and both recipients later received human organs, strengthening the case for animal-organ transplants.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The contract manufacturers get paid no matter which drug wins. Northway&#39;s new Lithuanian plant is exactly this kind of business: personalized cell and gene therapies are brutally hard to make, so whoever runs the factories collects fees on every therapy that needs building.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Northway Biotech, €61M:</strong> Opened a 3,500 square-meter cell and gene therapy manufacturing site in Lithuania, betting demand for making these complex therapies keeps climbing.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Ionis, FDA approval:</strong> Zanvastro&#39;s clearance for Alexander disease turns years of antisense research into a first-to-market product with no competition yet.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Guardant Health, FDA approval:</strong> Companion-diagnostic status ties its blood test directly to breast cancer treatment decisions, expanding where the test gets used and paid.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into AI. Mapping the protein interactions behind profound autism is the kind of messy biology that AI protein modeling is built to crack, so every new target map like this feeds the drug-discovery software that longevity companies increasingly depend on.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more first-ever approvals for rare diseases and wider use of blood tests that match patients to specific cancer drugs.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Treatment shifts from broad drugs toward therapies aimed at one disease or one person, rebuilding who makes money in medicine.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If these narrow drugs and tests can&#39;t get paid for at scale, because rare-disease patient counts are tiny or insurers balk at the cost, the economics collapse even as the science keeps working.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Rare-disease drugs and boutique diagnostics sound thrilling but serve small groups, so revenue can stay thin while costs run high. The market may be cheering scientific firsts that take a decade to become real businesses, and plenty of these therapies will stall in manufacturing, pricing fights, or slow doctor adoption.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">eGenesis, still private, is the name to track here: its gene-edited pig kidneys worked as a bridge until human organs became available, which could reshape how the organ shortage gets solved. Northway Biotech, also private, is the quieter bet on the factories that make advanced therapies possible.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Zanvastro reimbursement and uptake:</strong> Whether payers cover Ionis&#39;s rare-disease drug at a workable price shows if first-ever approvals actually turn into real revenue.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Tenax LEVEL Phase 3 readout:</strong> Full data on TNX-103 for pulmonary hypertension tells us whether another unmet-need condition gets a credible new therapy.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Guardant360 CDx adoption:</strong> How fast oncologists order the liquid biopsy proves whether blood-based patient selection is becoming standard practice.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#059669;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Longevity analysis on the site &amp;rarr;</a></td></tr><tr><td style="background:#ffffff;padding:32px 32px 0;"><table width="100%" cellpadding="0" cells .com/news/nscale-figure-3-5bn-compute-equity-stake" style="font-size:14px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://media.thenextweb.com/2026/05/Jensen-Huang-CEO-NVIDIA.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Nvidia now holds $99bn in shares of the companies that buy its chips</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">TNW</td><td style="padding-left:10px;"><a href="https://thenextweb.com/news/nvidia-equity-investments-99bn-portfolio" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://media.thenextweb.com/2026/04/meta-thinking-machines-lab-talent-raid.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fefce8;color:#ca8a04;margin-bottom:8px;">Energy &amp; Compute</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Thinking Machines is in talks to raise $6bn, The Information reports</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">TNW</td><td style="padding-left:10px;"><a href="https://thenextweb.com/news/thinking-machines-lab-6bn-round-nvidia-accel" style="font-size:12px;font-weight:600;color:#ca8a04;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://thenextweb.com/news/us-nvidia-chips-armenia-azerbaijan-peace-deal-chip-diplomacy" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">The US paid for a peace deal in Nvidia chips</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">TNW</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.europesays.com/3236868/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">OpenAI&#39;s Stargate Korea data center plans stall amid power and funding hurdles</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.europesays.com/3236400/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Hospitals Lag in Race to Quantum</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">EUROPE SAYS</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#2e1604 0%,#5c330d 52%,#875010 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Energy &amp; Compute &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Power, Not Chips, Now Decides Who Builds AI</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$99 billion</span>&amp;nbsp; Nvidia&#39;s stake in the companies that buy its chips, a fourteen-fold jump in a single year.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The thing holding back AI isn&#39;t chip supply anymore, it&#39;s electricity and the land and permits to make it, so the real money is shifting toward whoever can actually deliver power on time. Companies that own generation, grab land, and build gas plants next to data centers get paid no matter which AI lab wins.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The ones getting squeezed are the flashy compute projects that announce huge sites, then stall for a year because nobody nailed down the power or the funding first.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">OpenAI&#39;s Stargate Korea with Samsung and SK still has no settled sites, power, or funding nearly a year in, while a PPL joint venture just locked up 11 square miles in Pennsylvania for data center power plants. Meanwhile planned gas capacity tied to data centers is set to nearly double in early 2026.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Blowout earnings and raised guidance, plus a $99bn stake in its own customers, means it now funds the demand for its chips.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">PPL Corp</strong> Its joint venture grabbing 11 square miles for data center power plants shows the money moving toward whoever can supply electricity.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI, Samsung &amp; SK</strong> Their stalled Stargate Korea project is the warning: big compute ambitions mean nothing without power and funding locked down.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The quiet winners are the gas-power developers like PPL&#39;s joint venture and the pipeline and turbine suppliers behind them. They get paid to build generation whether the data center is filled by OpenAI, a robot lab, or nobody in particular.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nscale, $3.5B:</strong> It&#39;s selling Figure at least $3.5bn in compute while taking an equity stake, tying power supply directly to a robot maker.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Thinking Machines, $5B to $6B:</strong> Mira Murati&#39;s lab is raising a huge round with Nvidia supplying about half, another case of Nvidia funding its own demand.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia, $99B:</strong> Its equity portfolio, half in private customers, means the chipmaker is quietly bankrolling the buyers keeping its sales high.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This shows up straight in robotics. Nscale&#39;s $3.5bn compute deal with Figure, plus an equity stake, means the same power crunch squeezing AI labs now decides how fast humanoid robots can be trained and deployed.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more land grabs and gas plant deals, plus louder local fights over whether these data centers get approved at all.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Whoever controls power generation and grid access ends up owning the choke point of the entire AI economy.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If power buildout catches up fast, through the gas plants and grid deals now underway, electricity stops being the bottleneck and the advantage swings back to whoever simply has the most chips and cash.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The whole thing could be one big circle: Nvidia funds the labs that buy Nvidia chips, and if AI demand cools, that money stops flowing and the power buildout looks overbuilt. And gas plants take years, so today&#39;s frantic land grabs may deliver capacity right as the boom fades.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The live private names are here: Nscale, spending billions on compute and taking equity in Figure, and Mira Murati&#39;s Thinking Machines, raising up to $6bn with Nvidia backing. You can&#39;t buy either yet, but they show how private money and chipmaker cash are steering who gets power and compute first.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>
