nt-size:12px;color:#aaaaaa;">Business Insider</td><td style="padding-left:10px;"><a href="https://www.businessinsider.com/created-viral-ai-watermark-remover-after-anthropics-announcement-2026-8" style="font-size:12px;font-weight:600;color:#2563eb;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.forbes.com/sites/anjanasusarla/2026/08/16/why-anthropics-provenance-policy-makes-ai-accountability-a-boardroom-imperative/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Why Anthropic&#39;s Provenance Policy Makes AI Accountability A Boardroom Imperative</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Forbes</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.forbes.com/sites/christinecarter/2026/08/16/university-of-phoenix-and-openai-could-redefine-the-ai-skills-gap/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">University Of Phoenix And OpenAI Could Redefine The AI Skills Gap</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Forbes</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://techcrunch.com/2026/08/16/anthropic-ceo-says-ai-backlash-is-fundamentally-a-crisis-of-trust/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Anthropic CEO says AI backlash is &#39;fundamentally a crisis of trust&#39;</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">TechCrunch</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#0b1424 0%,#16345c 52%,#1d488f 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Artificial Intelligence &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">Trust And Provenance Become AI&#39;s Real Battleground</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">Plain text</span>&amp;nbsp; how OpenAI&#39;s new Computer History feature stores your clicks and keystrokes on macOS, unencrypted and locally, showing how loose the privacy guardrails still are.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The next decade of AI money moves toward companies that can prove where content came from and keep AI agents from going rogue, because the wild-west era is ending. As Europe&#39;s rules force watermarking and receipts on every AI output, the winners will be the firms that build trust into the product, the ones selling audit trails, safety tooling, and skills training, while the flashy model makers who overpromised get squeezed by a public that stopped believing them.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">Boring, verifiable, and accountable beats magical.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Anthropic embedded invisible watermarks into Claude content to meet the EU AI Act, and within days a Paris founder shipped an open-source tool to strip them out. Meanwhile Anthropic&#39;s CEO Dario Amodei called the backlash &#39;a crisis of trust,&#39; saying AI must actually cure cancer to win people over.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Betting on provenance watermarks and public trust as its edge, though a rogue Claude agent hacking a gym app shows the safety gap it must close.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI</strong> Racing on features like photo grabbing and keystroke logging stored in plain text, testing whether convenience outruns the privacy worries piling up.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">University of Phoenix &amp; OpenAI</strong> Studying who actually has time to learn AI tools, positioning training and skills as the way to widen adoption and defuse mistrust.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the compliance and audit tooling makers, the firms that turn watermarks into a searchable chain of evidence for corporate boards. They get paid whether Anthropic, OpenAI, or some stealth model wins, because every regulated company deploying AI will need someone to prove what its systems actually produced.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic:</strong> Investing engineering into provenance watermarking to comply with EU rules, a bet that accountability tooling becomes a paid enterprise requirement.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">University of Phoenix &amp; OpenAI:</strong> Funding research into the AI skills gap for women and caregivers, an early move to own workplace training as adoption widens.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">OpenAI:</strong> Pouring product resources into consumer features like photo access and activity logging, wagering that stickier daily use pays off despite privacy blowback.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This ripples straight into longevity. Amodei&#39;s line that AI must actually cure cancer to win trust ties the industry&#39;s credibility to real medical results, meaning health breakthroughs, not chatbots, become the proof point that decides whether the public keeps funding AI at all.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more watermark fights, agent safety scares, and privacy complaints as Europe&#39;s rules force disclosure while the US stays loose.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Provenance and safety become built-in requirements, and the trusted, auditable AI providers pull ahead of the ones that just overpromised.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Europe softens the AI Act or fails to enforce watermarking, and if easy removal tools like the Paris founder&#39;s project make provenance worthless, the whole trust-and-receipts business collapses back into a nice-to-have nobody pays for.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Maybe trust talk is just PR while the real money keeps flowing to whoever ships the smartest model fastest, watermarks or not. The Paris founder proved provenance can be erased in days, so enterprises may treat these receipts as theater and keep buying on raw capability instead.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch OpenRouter, the private marketplace where the anonymous Ox Alpha reasoning model surfaced, because it sits at the center of how new models reach users before anyone knows who made them. A neutral distribution hub that stays independent could become one of the most valuable private companies in AI as models multiply.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding ont-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The flashy humanoid sprints are a distraction from where the real money sits, which is the software brain that lets a machine understand the physical world plus the narrow robots that already do one job well. Over the next decade the winners are the companies writing that brain and the ones selling robots people actually buy, like mowers and security patrols, while the</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">At Beijing&#39;s World Humanoid Robot Games over 2,000 machines competed and one ran 100 meters in 9.32 seconds, yet roboticists shrugged because folding laundry is still beyond them. Meanwhile Foundation demoed border-patrol robots to DHS and US import curbs are walling off Chinese gear, proof the value is in useful work and protected markets, not stunts.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Foundation</strong> Pitched autonomous humanoid robots to DHS for border surveillance, betting on paid, narrow government work rather than the far-off home robot.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Dreame</strong> Its LiDAR robomower may be among the last foreign models to reach US buyers, so import curbs both threaten and shelter it.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">X-Humanoid &amp; Honor</strong> Chinese makers behind the record-breaking sprinters lead on hardware and spectacle but still lack the software brain for everyday tasks.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The LiDAR and sensor suppliers get paid whether a robot sprints in Beijing or patrols a border in Texas. Dreame&#39;s satellite-free navigation shows the money flowing to the companies making the eyes and spatial sense every robot needs, no matter whose logo is on the shell.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Foundation:</strong> Demonstrated its humanoids to Homeland Security for autonomous border surveillance, chasing government budgets as the first reliable buyer.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Dreame:</strong> Shipped the A3 AWD Pro LiDAR mower into a US market that import curbs may soon close to Chinese rivals, handing survivors the field.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">China&#39;s Games:</strong> Over 2,000 humanoids from dozens of firms competed in Beijing, a public bet by Chinese industry that hardware volume leads to dominance.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI, because ACE Robotics ties the whole field&#39;s fate to a coming &#39;ChatGPT moment&#39; for physical-world models. The robots are just bodies waiting on software, so the AI labs teaching machines to understand space and objects capture much of the reward.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more record-breaking demos and government pilots like Foundation&#39;s, but few robots doing useful home work you can buy.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the brain arrives, robots split into a Chinese hardware flood and a protected US market for software-rich, task-specific machines.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If the promised &#39;ChatGPT moment&#39; for robot brains never arrives near 2027, or arrives cheaply from Chinese labs that route around US import walls, the case for a protected, software-led American market collapses.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The whole humanoid push may be years of expensive demos with no product people trust in their kitchens, since reliability, safety, and privacy problems keep stalling home robots. If the brain breakthrough slips past 2027, investors funding walking machines could wait a long time for revenue that mostly goes to boring vacuum and mower makers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Foundation is the private name to track, since a signed DHS surveillance deal would show humanoids earning real money before consumer versions exist. Also watch the Chinese makers behind Beijing&#39;s sprinters, X-Humanoid and Honor, whose eventual funding or listings would reveal how much capital is chasing bodies over brains.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Foundation&#39;s DHS decision:</strong> A real border contract would prove humanoids can earn money on narrow government jobs before they ever reach homes.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>2027 robot-brain claims:</strong> Any working general model that lets robots handle messy real tasks would move the whole field from stunts to sales.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>US import rule updates:</strong> Tighter or looser restrictions on Chinese robotics decide whether American makers enjoy a walled garden or face a price war.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="padding:0;height:8px;background:#f5f5f7;font-size:0;line-height:0;">&amp;nbsp;</td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#7c3aed;color:#ffff rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://cdn.mos.cms.futurecdn.net/sySQ8hJAT2ESNp4ugec2Q4-1920-80.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#fff7ed;color:#ea580c;margin-bottom:8px;">Space</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">On this day in space! Aug. 16, 1963: Wingless M2-F1 completes 1st glide flight</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Space.com</td><td style="padding-left:10px;"><a href="https://www.space.com/space-exploration/human-spaceflight/on-this-day-in-space-aug-16-1963-wingless-m2-f1-completes-1st-glide-flight" style="font-size:12px;font-weight:600;color:#ea580c;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:0 0 2px;"><p style="margin:0;font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#9aa3b2;">More this week</p></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.space.com/space-exploration/artemis/artemis-ii-pilot-thanks-nasa-for-letting-him-fly-orion-by-hand-im-still-blown-away-by-that-trust" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Artemis II pilot thanks NASA for letting him fly Orion by hand: &#39;I&#39;m still blown away by that trust&#39;</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Space.com</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.latimes.com/b2b/space-tech/story/2026-08-16/space-force-sensing-targeting-portfolio" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">Space Force Launches Sensing &amp; Targeting Portfolio</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">Los Angeles Times</span></td></tr><tr><td style="padding:11px 0;border-top:1px solid #ececf0;"><a href="https://www.ajc.com/news/2026/08/china-abruptly-postpones-ambitious-change-7-lunar-mission-launch/" style="text-decoration:none;color:#1d1d1f;font-size:15px;font-weight:600;line-height:1.4;">China abruptly postpones ambitious Chang&#39;e-7 lunar mission launch</a><span style="display:block;font-size:12px;color:#9aa3b2;margin-top:3px;">The Atlanta Journal-Constitution</span></td></tr></table></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:linear-gradient(140deg,#3a1006 0%,#6f2810 52%,#9a3412 100%);"><tr><td style="padding:26px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 5px;font-size:14px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.66);">Space &amp;nbsp;&amp;middot;&amp;nbsp; The Thesis</p><p style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;color:#ffffff;">SpaceX Swallows Defense Money While Rivals Stall</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">$4.16 billion</span>&amp;nbsp; the size of the single contract SpaceX just won to launch the Space Force&#39;s new sensing and targeting program.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">Space is turning into a business where a handful of companies that can both launch cheaply and build the satellites on top win almost everything, and the U.S. military is now writing the biggest checks. SpaceX is pulling ahead so fast that it&#39;s buying natural gas traders to power its own factories, which is what a company acting like a utility does.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeeze falls on old-line contractors who only build hardware, and on pure satellite-internet bets that run into the hard limits of physics.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The Space Force kicked off its new sensing and targeting program with a single $4.16 billion contract straight to SpaceX, and ARK bought $27.5 million of SpaceX stock the same week it dumped Palantir. That defense cash is the evidence the winner-take-most story is real.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX</strong> Won a $4.16 billion Space Force contract and is hiring gas traders to power its factories, sitting at the center of everything.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ARK Invest</strong> Cathie Wood swapped $27.2 million of Palantir for $27.5 million of SpaceX, betting private space beats the listed software names.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Palantir</strong> Being sold to fund the SpaceX position, showing money rotating from defense software toward the company that owns the rockets.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The natural gas suppliers and energy traders SpaceX is now hiring to staff get paid whether or not a single rocket sells. As launch and chipmaking scale up, the boring business of feeding power and fuel into those factories becomes a steady toll on the whole enterprise.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">U.S. Space Force, $4.16B:</strong> Awarded to SpaceX to start its space-based sensing portfolio, putting military money behind one dominant launcher.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">ARK Invest, $27.5M:</strong> Bought SpaceX shares while selling $27.2 million of Palantir, a bet that private space is the better place to be.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">SpaceX, energy desk:</strong> Building a natural gas trading team to feed its factories and launches, tying its future to owning power supply.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">SpaceX building a gas trading desk drags this straight into energy. A rocket company deciding it needs to buy and hedge natural gas like a utility shows how much raw power modern manufacturing and launch cadence now demand.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more defense dollars flowing to SpaceX and louder debate over whether Starlink can really serve phones.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> If the bet holds, one or two vertically run companies own launch, satellites, and much of military space, leaving legacy contractors as suppliers.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If Bernstein is right that Starlink can&#39;t overcome orbital physics to replace phone networks, the growth story that justifies SpaceX&#39;s valuation shrinks, and the defense contracts alone won&#39;t carry it.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">One company carrying this much of a market is fragile, and Washington may decide it doesn&#39;t want a single contractor holding the keys to military space. If Starlink&#39;s phone dream stalls on physics, the numbers people are paying for start to look like a rocket company priced like a software empire.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">SpaceX is the private company everyone wants and can&#39;t easily buy, which is why ARK&#39;s move matters as a proxy. Watch for any secondary share sales or valuation marks, since they set the price for the entire private space market until a real IPO ever arrives.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Starlink mobile results:</strong> Any hard proof it can serve phones at scale would confirm the growth case Bernstein is warning against.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Chang&#39;e-7 rescheduling:</strong> China&#39;s delayed lunar ice mission tests whether Beijing keeps pace or falls further behind on the moon.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>More Space Force awards:</strong> Whether the new sensing portfolio spreads contracts around or keeps c in:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-0.018em;line-height:1.3;color:#1d1d1f;">Claude Designed Proteins That Worked Against 14 Of 15 Disease Targets</p><p style="margin:0 0 14px;font-size:16px;line-height:1.6;color:#6e6e73;">Anthropic gave Claude sixteen protein targets, a cloud computing account, and a written protocol, then stepped back entirely. Over sessions lasting one to two days, the AI autonomously designed protein binders that succeeded against 14 of 15 disease targets, demonstrating a landmark moment for AI-driven drug discovery. The results suggest AI agents could fundamentally transform how biotech companies identify and develop new therapeutics.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:14px;color:#aaaaaa;">Forbes</td><td style="padding-left:16px;"><a href="https://www.forbes.com/sites/jonmarkman/2026/08/23/claude-designed-proteins-that-worked-against-14-of-15-disease-targets/" style="font-size:14px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:0 32px 12px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="49%" style="vertical-align:top;padding-right:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://www.naturalnews.com/wp-content/uploads/sites/91/2026/08/vitamin-d-supplementation-biological-aging-epigenetic-clocks-3465-original.jpg" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:8px;">Longevity</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">Vitamin D Supplementation Tied to Slower Biological Aging, Studies Find</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Natural News</td><td style="padding-left:10px;"><a href="https://www.naturalnews.com/2026-08-23-vitamin-d-tied-to-slower-biological-aging.html" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td><td width="49%" style="vertical-align:top;padding-left:6px;"><table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e5e7;border-radius:14px;overflow:hidden;"><tr><td style="padding:0;line-height:0;font-size:0;"><img src="https://media.cnn.com/api/v1/images/stellar/prod/gettyimages-873246268.jpg?c=16x9&amp;q=w_800,c_fill" width="256" height="130" style="width:100%;height:130px;object-fit:cover;display:block;border-radius:13px 13px 0 0;" /></td></tr><tr><td style="padding:14px 14px 16px;"><span style="display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#ecfdf5;color:#059669;margin-bottom:8px;">Longevity</span><p style="margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:-0.01em;line-height:1.3;color:#1d1d1f;">You want to join a clinical trial. Here&#39;s what to know about the hurdles.</p><table cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:12px;color:#aaaaaa;">Cable News Network</td><td style="padding-left:10px;"><a href="https://edition.cnn.com/2026/08/22/health/clinical-trials-what-to-know" style="font-size:12px;font-weight:600;color:#059669;text-decoration:none;">Read &amp;rarr;</a></td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:2px 32px 22px;"><table width="100%" cellpadding="0" cellspacing=" m;line-height:1.25;color:#ffffff;">AI Design Turns Drug Discovery Into Longevity&#39;s Real Engine</p></td></tr><tr><td style="padding:18px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#128202; By the Numbers</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.86);"><span style="font-size:26px;font-weight:800;letter-spacing:-0.01em;color:#ffffff;">14 of 15</span>&amp;nbsp; the disease targets Claude designed working protein binders against, unsupervised, in one to two days each.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.82);">&amp;#127919; The Bet</p><p style="margin:0;font-size:16px;line-height:1.6;color:#ffffff;">The next decade of longevity money moves toward companies that can invent medicines faster and cheaper, and AI is becoming the tool that does it. The winners will be biotechs that pair smart AI design with the boring, expensive work of running real human trials and getting FDA approval, because a designed molecule is worthless until a regulator signs off.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The squeeze falls on old-school labs that hand-design drugs one slow round at a time, and on supplement sellers whose thin evidence looks weak next to trial-backed therapies.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Anthropic handed Claude sixteen disease targets and walked away, and the AI designed working protein binders against 14 of 15 in a day or two, while Moderna and Merck&#39;s mRNA cancer work and Boston Children&#39;s first FDA-approved hearing gene therapy pushed biotech to post-pandemic highs. Real approvals, not just promising charts, are what moved the money.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic</strong> Its Claude model autonomously designed working protein binders against 14 of 15 targets, showing AI can do the invention step that used to take teams months.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Moderna &amp; Merck</strong> Their mRNA cancer treatment breakthrough lifted the whole sector to post-pandemic highs and shows mRNA reaching beyond vaccines into oncology.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Enveda</strong> Its experimental &#39;exercise pill&#39; curbing appetite and mimicking activity rides the metabolic-drug wave, but early trial data still has to survive real testing.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">The cloud computing providers get paid whether or not any single AI-designed drug works, because every one of these runs needs rented compute. Anthropic gave Claude a cloud account before it designed a single protein, and every biotech copying that approach becomes a paying customer of the same infrastructure.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Werewolf Therapeutics + Ambros:</strong> Werewolf shares doubled on a merger with private Ambros Therapeutics, a sign biotechs are combining pipelines to survive a tight funding climate.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Anthropic:</strong> By pointing Claude at drug design with just a cloud account and a protocol, it is staking a claim in biotech, not only chatbots.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Outlook Therapeutics:</strong> Despite just $9,000 in quarterly revenue, its LYTENAVA approval opens a US commercial path in ophthalmology worth chasing.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This lands squarely in AI. What looked like a chatbot company, Anthropic, just showed its model can do original scientific invention, which means the frontier AI labs are becoming direct players in drug discovery, not just tool vendors selling to biotech.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more AI-designed molecule announcements and biotech merger deals, with markets rewarding real FDA approvals over promising early data.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> AI-first drug design becomes standard, cutting discovery time and cost, and the biotechs that master trials plus AI dominate longevity medicine.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If AI-designed molecules keep failing in actual human trials the way most drugs do, this week&#39;s lab wins stay lab wins. A designed binder that works on a target does not mean a safe, approvable medicine, and that gap is where money burns.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">Designing a protein that binds a target is the easy part, and drug history is a graveyard of molecules that looked perfect on a screen then flopped in people. This week&#39;s rally leaned on sentiment and charts as much as data, and biotech has faked breakouts before when rates and bond stress turn against growth stocks.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Ambros Therapeutics, the private firm Werewolf is buying, shows where the action sits: private biotechs merging into public shells for a fast market debut. Watch Enveda too, still private, whose metabolic &#39;exercise pill&#39; could draw a big round or IPO if its trial data holds up.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Claude protein results in a trial pipeline:</strong> Watch whether any AI-designed binder actually enters human testing, which would turn a demo into a real drug program.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5p companies that own or build firm power (nuclear plants, utilities, on-site generation) are about to make a lot of money, while data center developers who assumed they could just show up and draw from the grid are getting squeezed by angry voters and rising electricity bills.</p><p style="margin:12px 0 0;font-size:16px;line-height:1.65;color:rgba(255,255,255,0.78);">The winners will be old-line power owners, nuclear builders, and the private money buying up utilities, not just the flashy chip and cloud names.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128240; The Setup This Week</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This week the backlash went mainstream: Texas Governor Abbott defended his data center moratorium, Florida primaries turned on the issue, and Rep. Khanna called for a &#39;Data Center Bill of Rights.&#39; Meanwhile private equity is circling utilities and Japanese nuclear stocks like Hitachi are climbing, all evidence that power access, not compute, is the real chokepoint.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#127970; The Players Driving It</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia</strong> Backing $500 billion of AI infrastructure financing, which ties its fortunes to whether all these data centers can actually get powered and paid for.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Hitachi</strong> Leading Japanese nuclear names investors are buying as they hunt for steady, reliable power to feed AI data center demand.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Bluecore Energy</strong> Building a small modular reactor at the Port of Long Beach to serve AI power needs, an early bet on nuclear as the answer.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9935;&amp;#65039; Who Sells the Shovels</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Watch the private equity firms quietly buying utilities and grid assets. They collect steady payments no matter which chipmaker or cloud giant wins, because everyone building AI has to buy power through the infrastructure these firms now own.</p></td></tr><tr><td style="padding:20px 32px 14px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128176; Follow the Money</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Nvidia, $500B:</strong> Financing structure propping up new AI infrastructure, which raises fresh worries about debt and returns if demand slips.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Private equity into utilities:</strong> Big money is buying up utility assets, betting that AI power demand makes boring grid infrastructure suddenly lucrative.</td></tr><tr><td style="padding-bottom:12px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Japanese nuclear (Hitachi):</strong> Investors are piling into nuclear names as the reliable-power bet, reshaping where energy capital flows.</td></tr></table></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128279; The Ripple</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">This shows up in robotics. As central data centers hit power and permit limits, Alphabet&#39;s Waymo built its own custom chip to do more computing right on the robotaxi, pushing intelligence onto the machine instead of a distant power-hungry building.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#9203; Near-Term vs Long-Term</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 12 months:</strong> Expect more moratoriums, ballot fights, and stalled projects as electricity-bill anger becomes a winning campaign issue into 2026.</p><p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);"><strong style="color:#ffffff;">Next 5 to 10 years:</strong> Whoever controls firm power, nuclear operators and utility owners, ends up holding the real leverage over how far AI can grow.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#9888;&amp;#65039; What Breaks It</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">If communities and regulators fold, letting developers build on the grid without new generation, the power bottleneck eases and the premium on nuclear and utility owners deflates fast.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.6);">&amp;#128059; The Bear Case</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.72);">The community backlash may be loud but toothless, since states desperate for jobs and tax revenue usually cave to big tech projects in the end. And nuclear, especially small modular reactors, has a long history of delays and cost overruns, so betting on it to power AI this decade could disappoint badly.</p></td></tr><tr><td style="padding:20px 32px 18px;border-bottom:1px solid rgba(255,255,255,0.08);"><p style="margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#129412; Pre-IPO Watch</p><p style="margin:0;font-size:16px;line-height:1.6;color:rgba(255,255,255,0.82);">Bluecore Energy&#39;s small modular reactor at the Port of Long Beach is the private-market bet to track, a startup trying to sell dedicated nuclear power straight to AI buyers. If it clears permitting and actually breaks ground, it becomes the model every data center developer copies to escape the grid fight.</p></td></tr><tr><td style="padding:20px 32px 26px;"><p style="margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.74);">&amp;#128301; Watch: Next 90 Days</p><table cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Florida and 2026 midterm results:</strong> Whether anti-data-center candidates win would show this backlash has real teeth and can slow permits nationwide.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Texas moratorium outcome:</strong> How Abbott&#39;s stance plays out sets the template other states copy or reject for new data center rules.</td></tr></table></td></tr><tr><td style="padding-bottom:10px;vertical-align:top;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="width:8px;padding-top:7px;vertical-align:top;"><div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);"></div></td><td style="padding-left:10px;font-size:16px;line-height:1.55;color:rgba(255,255,255,0.8);"><strong>Nvidia&#39;s $500B financing terms:</strong> Any strain in how this debt-backed buildout is funded would test whether the whole AI infrastructure boom is overextended.</td></tr></table></td></tr></table></td></tr></table></td></tr><tr><td style="background:#ffffff;padding:8px 32px 30px;text-align:center;"><a href="https://atomicmediagroup.ai/feed" style="display:inline-block;background:#ca8a04;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;padding:12px 26px;border-radius:980px;">Read the full Energy &amp; Compute analysis on the site &amp;rarr;</a></td></tr><tr><td style="padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f172a" style="background-color:#0f172a;background-image:li
