<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  :root{ --paper:#f2f0ea; --ink:#19160f; --ink2:#3a362b; --mut:#6d6757; --ox:#7c2b2f; --line:#dcd7c9; }
  body {
    background:var(--paper);
    font-family:'Newsreader',Georgia,'Times New Roman',serif;
    color:var(--ink);
    padding:72px 80px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .mono { font-family:'IBM Plex Mono','Courier New',monospace; }
  .masthead {
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1.5px solid var(--line); padding-bottom:26px;
  }
  .brand { display:flex; align-items:baseline; gap:16px; }
  .mark { font-size:58px; font-weight:600; color:var(--ox); line-height:1; }
  .wordmark { font-size:40px; font-weight:600; letter-spacing:-0.01em; color:var(--ink); }
  .pub { font-size:18px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--mut); }
  .center { }
  .eyebrow { font-size:20px; font-weight:600; letter-spacing:0.24em; text-transform:uppercase; color:var(--ox); margin-bottom:22px; }
  .headline {
    font-size:92px; font-weight:600; line-height:1.02; letter-spacing:-0.025em; color:var(--ink); max-width:1000px;
  }
  .headline em { font-style:italic; color:var(--ox); }
  .tagline { font-size:29px; font-weight:400; line-height:1.4; color:var(--ink2); margin-top:26px; max-width:860px; }
  .forces {
    border-top:1.5px solid var(--line); padding-top:22px; white-space:nowrap;
    font-size:17px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--mut);
  }
  .forces b { color:var(--ox); font-weight:600; }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand"><span class="mark">V</span><span class="wordmark">The Atomic Five</span></div>
    <div class="pub mono">Atomic Media Group</div>
  </div>
  <div class="center">
    <div class="eyebrow mono">Five forces &middot; one investment thesis</div>
    <div class="headline">Know where humanity is <em>headed</em>.</div>
    <div class="tagline">A two-minute investment thesis on the forces shaping the future, every weekday.</div>
  </div>
  <div class="forces mono">Artificial Intelligence &nbsp;&middot;&nbsp; Robotics &nbsp;&middot;&nbsp; Space &nbsp;&middot;&nbsp; Longevity &nbsp;&middot;&nbsp; Energy <b>&amp; Compute</b></div>
</body>
</html>
